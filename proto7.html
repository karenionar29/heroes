<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#12151c">
<title>六格見方・立體原型</title>
<style>
:root{--ink:#12151c;--slate:#1d222d;--line:#2c3342;--paper:#e6ddcb;
  --cinnabar:#b5342b;--gold:#c9a227;--jade:#2f8f74;--dim:#8b93a4;
  --serif:"Noto Serif TC","Songti TC",serif;
  --sans:-apple-system,"PingFang TC","Noto Sans TC",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ink);color:#e8e0cf;font-family:var(--sans);
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:480px;margin:0 auto;padding:10px 12px 20px}
.screen{display:none}.screen.on{display:block}
h1{font-family:var(--serif);font-size:29px;letter-spacing:.16em;text-align:center;margin:22px 0 4px}
.sub{text-align:center;color:var(--dim);font-size:12px;letter-spacing:.18em;margin-bottom:14px}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:12px 0}
.btn{display:block;width:100%;padding:14px;margin:8px 0;border:1px solid var(--line);
  background:var(--slate);color:#e8e0cf;font-family:var(--serif);font-size:17px;
  letter-spacing:.1em;border-radius:3px;cursor:pointer;text-align:center}
.btn.main{background:var(--cinnabar);border-color:#8f2820;color:#fff4ec}
.btn small{display:block;font-family:var(--sans);font-size:12px;letter-spacing:0;color:var(--dim);margin-top:3px}
.btn.main small{color:rgba(255,255,255,.72)}
.hint{color:var(--dim);font-size:13px;line-height:1.9;margin:8px 0}
.topbar{display:flex;justify-content:space-between;align-items:center;
  font-size:12px;color:var(--dim);letter-spacing:.08em;margin-bottom:7px}
.topbar button{background:none;border:none;color:var(--dim);font-size:12px;cursor:pointer}
.turnbar{display:flex;gap:4px;margin-bottom:8px}
.turnbar i{flex:1;height:4px;background:var(--line);border-radius:2px}
.turnbar i.done{background:var(--jade)}.turnbar i.now{background:var(--gold)}
#view{width:100%;aspect-ratio:1/0.92;border-radius:4px;overflow:hidden;
  background:#161a22;border:1px solid #3a3f4d;position:relative;touch-action:none}
#view canvas{display:block;width:100%;height:100%}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  flex-direction:column;color:var(--dim);font-size:13px;gap:8px;text-align:center;padding:20px}
.say{text-align:center;font-size:13.5px;color:var(--gold);font-family:var(--serif);
  letter-spacing:.04em;margin:9px 0 5px;min-height:22px;line-height:1.5}
.heroes{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.h{background:var(--slate);border:1px solid var(--line);border-radius:3px;padding:9px 5px;
  text-align:center;cursor:pointer;transition:.12s}
.h.on{border-color:var(--gold);background:#2a2413}
.h.used{opacity:.28;pointer-events:none}
.h b{font-family:var(--serif);font-size:14px;display:block;letter-spacing:.02em}
.h i{font-style:normal;font-size:11px;color:var(--gold);display:block;margin-top:3px}
.h u{text-decoration:none;font-size:10.5px;color:var(--dim);display:block;margin-top:4px;line-height:1.45}
.big{text-align:center;font-family:var(--serif);font-size:31px;letter-spacing:.16em;margin:20px 0 6px}
.fact{background:var(--slate);border-left:3px solid var(--gold);padding:10px 12px;margin:7px 0;
  font-size:12.5px;line-height:1.8;border-radius:0 3px 3px 0}
.fact b{font-family:var(--serif);font-size:14px;display:block;margin-bottom:3px;letter-spacing:.05em}
.err{background:#2a1414;border:1px solid #5a2f2a;border-radius:4px;padding:11px;
  font-size:12.5px;line-height:1.7;color:#e8b0a6;margin:10px 0}
</style>
</head>
<body>
<div class="wrap">

<section id="s-title" class="screen on">
  <h1>六格見方</h1>
  <div class="sub">人 物 立 體 版 ・ 同 一 關</div>
  <div class="rule"></div>
  <p class="hint">
    規則跟上一版<b style="color:#e8e0cf">一模一樣</b>，只換了畫面。<br>
    這一版把<b style="color:var(--gold)">人物也做成立體的</b>——三位偉人站在城後面守著，各自拿著自己的信物。
  </p>
  <div class="rule"></div>
  <p class="hint">
    <b style="color:var(--gold);font-family:var(--serif)">印和闐</b>　舉起量桿，金字塔從地底長出來<br>
    <b style="color:var(--gold);font-family:var(--serif)">華佗</b>　把藥葫蘆丟過去，敵人冒綠煙倒下<br>
    <b style="color:var(--gold);font-family:var(--serif)">諸葛亮</b>　搖羽扇，光牆升起，城樓上一把琴
  </p>
  <button class="btn main" onclick="G.start()">開始<small>撐過五回合就贏</small></button>
  <p class="hint" style="text-align:center;font-size:11.5px;margin-top:12px">
    立體場景全部用程式堆出來，零模型檔。
  </p>
</section>

<section id="s-play" class="screen">
  <div class="topbar"><span id="turnTxt">第 1 回合</span><button onclick="G.start()">重來</button></div>
  <div class="turnbar" id="turnbar"></div>
  <div id="view"><div id="loading">正在搭建場景⋯⋯</div></div>
  <div class="say" id="say">選一位偉人</div>
  <div class="heroes" id="heroes"></div>
  <button class="btn" onclick="G.pass()">這回合什麼都不做</button>
</section>

<section id="s-end" class="screen">
  <div class="big" id="endTxt">—</div>
  <p class="hint" id="endSub" style="text-align:center"></p>
  <div class="rule"></div>
  <div id="facts"></div>
  <button class="btn main" onclick="G.start()">再解一次</button>
  <button class="btn" onclick="G.go('title')">回首頁</button>
</section>

</div>

<script>
/* ══════════════════════════════════════════════
   六格見方・立體版
   規則層與上一版完全相同（已窮舉驗證：什麼都不做必輸、
   十萬種下法只有 7.37% 能贏、最少要用兩個技能）
   這一版只換掉「畫面」那一層 —— 渲染層可抽換的實作
   ══════════════════════════════════════════════ */
const W=6, H=6, TURNS=5;
const MAP0 = ['......','.####.','C.....','.####.','......','......'];
const CITY = {x:0,y:2};
const START = [{x:4,y:2},{x:1,y:5}];
const HEROES = [
  {id:'imhotep', n:'印和闐', s:'階梯金字塔', d:'指定一格，永久變成牆', target:'cell',
   f:'他蓋了世界第一座金字塔，後來埃及人乾脆把他當成神來拜。'},
  {id:'huatuo',  n:'華佗',   s:'麻沸散',     d:'指定一個敵人，睡兩回合', target:'enemy',
   f:'他用麻沸散讓病人睡著再開刀，是最早的麻醉紀錄之一。'},
  {id:'zhugeliang', n:'諸葛亮', s:'空城計',  d:'指定一格，兩回合內敵人不敢靠近', target:'cell',
   f:'他大開城門獨自撫琴，司馬懿疑心有埋伏，帶兵撤了。'}
];

/* ---- 音效 ---- */
const S=(()=>{let ac=null;
  const ok=()=>{try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();return 1}catch(e){return 0}};
  const t=(f,d,ty,v)=>{if(!ok())return;const o=ac.createOscillator(),g=ac.createGain();
    o.type=ty||'sine';o.frequency.value=f;g.gain.setValueAtTime(0,ac.currentTime);
    g.gain.linearRampToValueAtTime(v||.12,ac.currentTime+.008);
    g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);
    o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);};
  const noise=(d,v,f)=>{if(!ok())return;const n=ac.sampleRate*d,b=ac.createBuffer(1,n,ac.sampleRate),c=b.getChannelData(0);
    for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);
    const src=ac.createBufferSource();src.buffer=b;const fl=ac.createBiquadFilter();
    fl.type='bandpass';fl.frequency.value=f||500;const g=ac.createGain();g.gain.value=v;
    src.connect(fl);fl.connect(g);g.connect(ac.destination);src.start();};
  return{tap:()=>t(520,.06,'triangle',.08),
    build:()=>{noise(.5,.2,260);[110,140,170,200].forEach((f,i)=>setTimeout(()=>t(f,.2,'square',.1),i*110))},
    sleep:()=>{t(440,.16,'sine',.1);setTimeout(()=>t(260,.3,'sine',.09),110);setTimeout(()=>t(170,.4,'sine',.07),260)},
    ghost:()=>{noise(.35,.12,900);[620,780,930].forEach((f,i)=>setTimeout(()=>t(f,.22,'triangle',.08),i*90))},
    step:()=>{noise(.08,.09,340)},
    win:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>t(f,.28,'triangle',.12),i*118))},
    lose:()=>{noise(.5,.2,180);[400,300,220,150].forEach((f,i)=>setTimeout(()=>t(f,.26,'square',.1),i*140))}};
})();

/* ---- 規則層（與 2D 版逐字相同）---- */
const key=(x,y)=>y*W+x;
function isWall(g,x,y){ return x<0||y<0||x>=W||y>=H||g[y][x]==='#'; }
function distMap(g, avoid){
  const q=[[CITY.x,CITY.y]], d={}; d[key(CITY.x,CITY.y)]=0;
  while(q.length){ const [x,y]=q.shift();
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{
      const nx=x+dx, ny=y+dy;
      if(isWall(g,nx,ny)||avoid.has(key(nx,ny))||d[key(nx,ny)]!==undefined) return;
      d[key(nx,ny)]=d[key(x,y)]+1; q.push([nx,ny]); }); }
  return d;
}
function nextStep(g,e,avoid){
  const d=distMap(g,avoid); let best=null,bd=1e9;
  [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{
    const nx=e.x+dx, ny=e.y+dy;
    if(isWall(g,nx,ny)||avoid.has(key(nx,ny))) return;
    const v=d[key(nx,ny)]; if(v!==undefined&&v<bd){bd=v;best={x:nx,y:ny};} });
  return best;
}

/* ══════════ 立體場景（Three.js，全部用基本幾何堆，零模型檔）══════════ */
const V = {
  ok:false, scene:null, cam:null, ren:null, ray:null, T:null,
  tiles:[], walls:{}, enemies:[], heroes:{}, cityMesh:null, ghostGroup:null,
  hi:[], anims:[], puffs:[], shake:0, _last:0,

  async boot(){
    if(this.ok) return true;
    const CDNS=[
      'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
      'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js',
      'https://unpkg.com/three@0.128.0/build/three.min.js'
    ];
    for(const url of CDNS){
      try{
        await new Promise((res,rej)=>{
          const sc=document.createElement('script'); sc.src=url;
          sc.onload=res; sc.onerror=()=>rej(new Error(url)); document.head.appendChild(sc);
        });
        if(window.THREE){ this.T=window.THREE; break; }
      }catch(e){}
    }
    if(!this.T) return false;
    this.build(); this.ok=true; return true;
  },

  build(){
    const T=this.T, host=document.getElementById('view');
    const w=host.clientWidth||360, h=host.clientHeight||330;
    this.scene=new T.Scene();
    this.scene.background=new T.Color(0x11141b);
    this.scene.fog=new T.Fog(0x11141b, 13, 30);
    this.cam=new T.PerspectiveCamera(40, w/h, 0.1, 100);
    this.camHome={x:0,y:9.8,z:9.2};
    this.cam.position.set(this.camHome.x,this.camHome.y,this.camHome.z);
    this.cam.lookAt(0,0,0.6);
    this.ren=new T.WebGLRenderer({antialias:true});
    this.ren.setPixelRatio(Math.min(2, window.devicePixelRatio||1));
    this.ren.setSize(w,h);
    this.ren.shadowMap.enabled=true; this.ren.shadowMap.type=T.PCFSoftShadowMap;
    host.innerHTML=''; host.appendChild(this.ren.domElement);
    this.ray=new T.Raycaster();

    this.scene.add(new T.AmbientLight(0xd9d2c0, 0.7));
    const dir=new T.DirectionalLight(0xfff4dd, 1.0);
    dir.position.set(-5.5,11,6.5); dir.castShadow=true;
    dir.shadow.mapSize.set(1024,1024);
    const c=dir.shadow.camera; c.left=-8;c.right=8;c.top=8;c.bottom=-8;c.near=1;c.far=30;
    this.scene.add(dir);
    const rim=new T.DirectionalLight(0x9fb6d8, 0.34);
    rim.position.set(7,4,-7); this.scene.add(rim);

    const base=new T.Mesh(new T.BoxGeometry(W+0.8, 0.5, H+2.6),
      new T.MeshStandardMaterial({color:0x2a2f3a, roughness:.95}));
    base.position.set(0,-0.35,0.9); base.receiveShadow=true; this.scene.add(base);

    this.tileGroup=new T.Group(); this.scene.add(this.tileGroup);
    this.objGroup =new T.Group(); this.scene.add(this.objGroup);
    this.fxGroup  =new T.Group(); this.scene.add(this.fxGroup);
  },

  pos(x,y){ return {x:x-(W-1)/2, z:y-(H-1)/2}; },
  mat(col,rough,emis){ return new this.T.MeshStandardMaterial({color:col,roughness:rough===undefined?.75:rough,emissive:emis||0x000000}); },

  /* ---------- 人物：用基本幾何堆出「一眼認得出是誰」的剪影 ---------- */
  makeFigure(cfg){
    const T=this.T, g=new T.Group();
    // 袍身：上窄下寬的圓台
    const robe=new T.Mesh(new T.CylinderGeometry(0.19,0.36,0.78,10), this.mat(cfg.robe,.85));
    robe.position.y=0.39; robe.castShadow=true; g.add(robe);
    // 肩
    const sh=new T.Mesh(new T.CylinderGeometry(0.26,0.24,0.12,10), this.mat(cfg.robe2||cfg.robe,.8));
    sh.position.y=0.82; sh.castShadow=true; g.add(sh);
    // 頭
    const head=new T.Mesh(new T.SphereGeometry(0.16,14,12), this.mat(cfg.skin||0xd9b48a,.65));
    head.position.y=1.03; head.castShadow=true; g.add(head);
    // 頭上的東西
    if(cfg.hat==='tall'){                    // 諸葛亮的綸巾：方冠
      const hat=new T.Mesh(new T.BoxGeometry(0.34,0.26,0.3), this.mat(0x2c3140,.9));
      hat.position.y=1.24; hat.castShadow=true; g.add(hat);
    } else if(cfg.hat==='bun'){              // 華佗的髮髻
      const bun=new T.Mesh(new T.SphereGeometry(0.09,10,8), this.mat(0x1c1a18,.9));
      bun.position.set(0,1.19,-0.02); g.add(bun);
    } else if(cfg.hat==='helm'){             // 士兵的盔
      const helm=new T.Mesh(new T.ConeGeometry(0.2,0.26,8), this.mat(0x6b6f78,.5));
      helm.position.y=1.16; helm.castShadow=true; g.add(helm);
      const plume=new T.Mesh(new T.ConeGeometry(0.05,0.22,6), this.mat(0xd6402f,.6,0x2a0a06));
      plume.position.y=1.38; g.add(plume);
    } else if(cfg.hat==='collar'){           // 印和闐的金項圈＋光頭
      const col=new T.Mesh(new T.TorusGeometry(0.2,0.045,8,16), this.mat(0xc9a227,.35));
      col.position.y=0.9; col.rotation.x=Math.PI/2; col.castShadow=true; g.add(col);
    }
    // 鬍子
    if(cfg.beard){
      const b=new T.Mesh(new T.ConeGeometry(0.1,0.26,8), this.mat(cfg.beard,.9));
      b.position.set(0,0.9,0.13); b.rotation.x=Math.PI; g.add(b);
    }
    // 手上的信物（這是一眼認人的關鍵）
    const prop=new T.Group(); prop.position.set(0.3,0.72,0.06); g.add(prop);
    if(cfg.prop==='rod'){                    // 印和闐：測量桿
      const r=new T.Mesh(new T.CylinderGeometry(0.032,0.032,1.15,8), this.mat(0xb08a4a,.7));
      r.position.y=0.28; r.castShadow=true; prop.add(r);
      const k=new T.Mesh(new T.BoxGeometry(0.16,0.16,0.06), this.mat(0xc9a227,.35));
      k.position.y=0.86; prop.add(k);
    } else if(cfg.prop==='gourd'){           // 華佗：藥葫蘆
      const g1=new T.Mesh(new T.SphereGeometry(0.15,12,10), this.mat(0x3f9aa8,.6));
      g1.position.y=-0.02; prop.add(g1);
      const g2=new T.Mesh(new T.SphereGeometry(0.1,12,10), this.mat(0x3f9aa8,.6));
      g2.position.y=0.16; prop.add(g2);
      const cap=new T.Mesh(new T.CylinderGeometry(0.05,0.06,0.07,8), this.mat(0x8a6a3a,.8));
      cap.position.y=0.27; prop.add(cap);
    } else if(cfg.prop==='fan'){             // 諸葛亮：羽扇
      const f=new T.Mesh(new T.CircleGeometry(0.26,16,0,Math.PI), this.mat(0xf0ead9,.9));
      f.position.y=0.22; f.rotation.y=Math.PI/2; prop.add(f);
      const f2=f.clone(); f2.rotation.y=-Math.PI/2; prop.add(f2);
      const st=new T.Mesh(new T.CylinderGeometry(0.028,0.028,0.3,6), this.mat(0x6b5a3a,.8));
      st.position.y=0.02; prop.add(st);
    } else if(cfg.prop==='spear'){           // 士兵：長矛
      const sp=new T.Mesh(new T.CylinderGeometry(0.03,0.03,1.25,6), this.mat(0x6b5334,.85));
      sp.position.y=0.3; sp.castShadow=true; prop.add(sp);
      const tip=new T.Mesh(new T.ConeGeometry(0.08,0.24,6), this.mat(0xa9adb5,.35));
      tip.position.y=1.02; prop.add(tip);
    }
    g.userData.prop=prop; g.userData.head=head; g.userData.robe=robe;
    return g;
  },

  reset(grid){
    const T=this.T;
    [this.tileGroup,this.objGroup,this.fxGroup].forEach(G=>{
      while(G.children.length) G.remove(G.children[0]);
    });
    this.tiles=[]; this.walls={}; this.enemies=[]; this.heroes={};
    this.hi=[]; this.anims=[]; this.puffs=[]; this.ghostGroup=null;

    const tileGeo=new T.BoxGeometry(0.92,0.14,0.92);
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){
      const p=this.pos(x,y);
      const isC=(x===CITY.x&&y===CITY.y);
      const m=new T.Mesh(tileGeo, this.mat(isC?0x6b5a24:0xd9d0bb,.9));
      m.position.set(p.x,0,p.z); m.receiveShadow=true;
      m.userData={x,y}; this.tileGroup.add(m); this.tiles.push(m);
      if(grid[y][x]==='#') this.addWall(x,y,false);
    }
    // 城：金色門樓
    const g=new T.Group(); const p=this.pos(CITY.x,CITY.y);
    const gm=new T.MeshStandardMaterial({color:0xc9a227,roughness:.42,metalness:.28});
    [[-0.3,0.5,0.2,0.9,0.2],[0.3,0.5,0.2,0.9,0.2],[0,1.02,0.92,0.18,0.3]].forEach(([px,py,sx,sy,sz])=>{
      const b=new T.Mesh(new T.BoxGeometry(sx,sy,sz),gm);
      b.position.set(px,py,0); b.castShadow=true; g.add(b);
    });
    g.position.set(p.x,0,p.z); this.objGroup.add(g); this.cityMesh=g;

    // 三位偉人：站在城後面守著（這樣他們才是「在場」的角色，不只是按鈕）
    const specs=[
      {id:'imhotep',   robe:0xe4dcc6, robe2:0xc9a227, skin:0xb98b5e, hat:'collar', prop:'rod'},
      {id:'huatuo',    robe:0x2f4a6b, robe2:0x24384f, skin:0xd9b48a, hat:'bun', beard:0xdad4c6, prop:'gourd'},
      {id:'zhugeliang',robe:0xf0ead9, robe2:0xd8cfb6, skin:0xd9b48a, hat:'tall', beard:0x2a2622, prop:'fan'}
    ];
    specs.forEach((sp,i)=>{
      const f=this.makeFigure(sp);
      const px=-(W-1)/2 - 1.15;
      f.position.set(px, 0, (i-1)*1.05 + 0.4);
      f.rotation.y=Math.PI/2;      // 面向棋盤
      f.userData.home={x:f.position.x,z:f.position.z};
      this.objGroup.add(f); this.heroes[sp.id]=f;
    });
  },

  /* 出招：偉人往前跨一步、舉起信物 */
  heroAct(id, then){
    const f=this.heroes[id]; if(!f){ then&&then(); return; }
    const home=f.userData.home, prop=f.userData.prop;
    this.anims.push({t:0,dur:520,fn:(k)=>{
      const e=Math.sin(k*Math.PI);
      f.position.x=home.x+e*0.75;
      f.position.y=Math.sin(k*Math.PI)*0.1;
      prop.rotation.z=-e*1.15;              // 舉起來
      if(k>=1){ f.position.x=home.x; f.position.y=0; prop.rotation.z=0; }
    }});
    setTimeout(()=>then&&then(), 300);
  },

  addWall(x,y,built){
    const T=this.T, p=this.pos(x,y), g=new T.Group();
    if(built){
      const m=this.mat(0xc9a86a,.85);
      for(let i=0;i<4;i++){
        const s=0.86-i*0.18;
        const b=new T.Mesh(new T.BoxGeometry(s,0.24,s),m);
        b.position.y=0.12+i*0.24; b.castShadow=true; b.receiveShadow=true; g.add(b);
      }
      const cap=new T.Mesh(new T.TetrahedronGeometry(0.16), this.mat(0xc9a227,.35));
      cap.position.y=1.06; cap.rotation.y=Math.PI/4; g.add(cap);
      g.scale.y=0.01;
      this.anims.push({t:0,dur:720,fn:(k)=>{
        const e=1-Math.pow(1-k,3);
        g.scale.y=0.01+e*0.99; g.rotation.y=(1-e)*0.6;
      }});
      this.dust(p.x,p.z,26,0xc9a86a);
      this.shake=Math.max(this.shake,0.3);
    }else{
      const b=new T.Mesh(new T.BoxGeometry(0.9,0.62,0.9), this.mat(0x2b2f38,1));
      b.position.y=0.31; b.castShadow=true; b.receiveShadow=true; g.add(b);
    }
    g.position.set(p.x,0,p.z);
    this.objGroup.add(g); this.walls[key(x,y)]=g;
  },

  /* 塵土／煙霧粒子 */
  dust(x,z,n,col,high){
    const T=this.T;
    for(let i=0;i<n;i++){
      const s=new T.Mesh(new T.SphereGeometry(0.06+Math.random()*0.07,6,5),
        new T.MeshBasicMaterial({color:col,transparent:true,opacity:.75}));
      const a=Math.random()*6.283, r=Math.random()*0.45;
      s.position.set(x+Math.cos(a)*r, (high||0.1)+Math.random()*0.2, z+Math.sin(a)*r);
      this.fxGroup.add(s);
      this.puffs.push({m:s, vx:Math.cos(a)*0.035, vy:0.02+Math.random()*0.05,
        vz:Math.sin(a)*0.035, life:1});
    }
  },

  addEnemy(e){
    const T=this.T;
    const g=this.makeFigure({robe:0xb5342b, robe2:0x8f2820, skin:0xc98f6a, hat:'helm', prop:'spear'});
    // 頭上的箭頭：下一步走哪
    const ar=new T.Group();
    const shaft=new T.Mesh(new T.BoxGeometry(0.09,0.09,0.4), this.mat(0xe2564a,.5,0x5a1a14));
    shaft.position.z=-0.22; ar.add(shaft);
    const tip=new T.Mesh(new T.ConeGeometry(0.15,0.28,4), this.mat(0xe2564a,.5,0x5a1a14));
    tip.position.z=-0.54; tip.rotation.x=-Math.PI/2; ar.add(tip);
    ar.position.y=1.62; g.add(ar);
    const p=this.pos(e.x,e.y); g.position.set(p.x,0,p.z);
    this.objGroup.add(g);
    this.enemies.push({g,arrow:ar,ref:e,zzz:null});
  },

  moveEnemy(i,x,y){
    const o=this.enemies[i]; if(!o) return;
    const from={x:o.g.position.x,z:o.g.position.z}, to=this.pos(x,y);
    this.anims.push({t:0,dur:400,fn:(k)=>{
      const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
      o.g.position.x=from.x+(to.x-from.x)*e;
      o.g.position.z=from.z+(to.z-from.z)*e;
      o.g.position.y=Math.abs(Math.sin(k*Math.PI*2))*0.12;   // 走路上下晃
      if(k>=1) o.g.position.y=0;
    }});
  },

  /* 華佗：葫蘆真的飛出去，砸到敵人冒綠煙 */
  throwGourd(i, done){
    const T=this.T, o=this.enemies[i]; if(!o){ done&&done(); return; }
    const from=this.heroes['huatuo'] ? this.heroes['huatuo'].position.clone() : new T.Vector3(-4,1,0);
    from.y=1.0;
    const to=o.g.position.clone(); to.y=1.0;
    const ball=new T.Group();
    const g1=new T.Mesh(new T.SphereGeometry(0.15,12,10), this.mat(0x3f9aa8,.6));
    const g2=new T.Mesh(new T.SphereGeometry(0.1,12,10), this.mat(0x3f9aa8,.6));
    g2.position.y=0.16; ball.add(g1); ball.add(g2);
    ball.position.copy(from); this.fxGroup.add(ball);
    this.anims.push({t:0,dur:480,fn:(k)=>{
      ball.position.x=from.x+(to.x-from.x)*k;
      ball.position.z=from.z+(to.z-from.z)*k;
      ball.position.y=from.y+(to.y-from.y)*k + Math.sin(k*Math.PI)*1.5;
      ball.rotation.x+=0.28; ball.rotation.z+=0.2;
      if(k>=1){
        this.fxGroup.remove(ball);
        this.dust(to.x,to.z,30,0x6fd0b0,0.6);   // 綠色藥煙
        this.shake=Math.max(this.shake,0.18);
        done&&done();
      }
    }});
  },

  sleepEnemy(i){
    const T=this.T, o=this.enemies[i]; if(!o) return;
    o.arrow.visible=false;
    this.anims.push({t:0,dur:640,fn:(k)=>{
      const e=1-Math.pow(1-k,3);
      o.g.rotation.z=e*Math.PI*0.44;
      o.g.position.y=-e*0.1;
    }});
    // 頭上冒 Z
    const zg=new T.Group();
    for(let n=0;n<3;n++){
      const z=new T.Mesh(new T.BoxGeometry(0.14,0.035,0.02),
        new T.MeshBasicMaterial({color:0x6fd0b0,transparent:true,opacity:.9}));
      z.position.set(0.1*n, 1.5+n*0.22, 0);
      z.rotation.z=0.5; zg.add(z);
    }
    o.g.add(zg); o.zzz=zg;
    this.anims.push({t:0,dur:99999,fn:(k)=>{ zg.rotation.y+=0.02; }});
  },
  wakeEnemy(i){
    const o=this.enemies[i]; if(!o) return;
    o.arrow.visible=true;
    if(o.zzz){ o.g.remove(o.zzz); o.zzz=null; }
    this.anims.push({t:0,dur:420,fn:(k)=>{
      const e=1-Math.pow(1-k,3);
      o.g.rotation.z=(1-e)*Math.PI*0.44;
      o.g.position.y=-(1-e)*0.1;
    }});
  },
  setArrow(i,dx,dy,show){
    const o=this.enemies[i]; if(!o) return;
    o.arrow.visible=!!show; if(!show) return;
    o.arrow.rotation.y=Math.atan2(-dx,-dy);
  },

  /* 諸葛亮：光牆升起 */
  showGhost(cells,center){
    const T=this.T; this.clearGhost();
    const g=new T.Group();
    const mat=new T.MeshStandardMaterial({color:0x9b6bb5,transparent:true,opacity:.3,
      roughness:.35, emissive:0x35174a});
    cells.forEach(k=>{
      const x=k%W, y=(k/W)|0, p=this.pos(x,y);
      const b=new T.Mesh(new T.BoxGeometry(0.9,1.7,0.9),mat);
      b.position.set(p.x,0.85,p.z); g.add(b);
    });
    const p=this.pos(center.x,center.y);
    // 中央一把發光的琴（空城計＝坐在城樓上撫琴）
    const qin=new T.Mesh(new T.BoxGeometry(0.62,0.09,0.2), this.mat(0xc9a227,.4,0x4a3a08));
    qin.position.set(p.x,1.85,p.z); g.add(qin);
    for(let i=0;i<4;i++){
      const s=new T.Mesh(new T.BoxGeometry(0.58,0.012,0.012),
        new T.MeshBasicMaterial({color:0xffe9a8,transparent:true,opacity:.85}));
      s.position.set(p.x,1.92,p.z-0.06+i*0.04); g.add(s);
    }
    g.scale.y=0.01;
    this.anims.push({t:0,dur:600,fn:(k)=>{ g.scale.y=0.01+(1-Math.pow(1-k,3))*0.99; }});
    this.dust(p.x,p.z,20,0xb98fd0,0.4);
    this.objGroup.add(g); this.ghostGroup=g;
    this.shake=Math.max(this.shake,0.18);
  },
  clearGhost(){ if(this.ghostGroup){ this.objGroup.remove(this.ghostGroup); this.ghostGroup=null; } },

  highlight(list){
    const T=this.T;
    this.hi.forEach(m=>this.tileGroup.remove(m)); this.hi=[];
    list.forEach(({x,y})=>{
      const p=this.pos(x,y);
      const m=new T.Mesh(new T.BoxGeometry(0.94,0.02,0.94),
        new T.MeshBasicMaterial({color:0xc9a227,transparent:true,opacity:.5}));
      m.position.set(p.x,0.09,p.z);
      this.tileGroup.add(m); this.hi.push(m);
    });
  },

  pick(ev){
    if(!this.ok) return null;
    const r=this.ren.domElement.getBoundingClientRect();
    const v=new this.T.Vector2(
      ((ev.clientX-r.left)/r.width)*2-1,
      -((ev.clientY-r.top)/r.height)*2+1);
    this.ray.setFromCamera(v,this.cam);
    const hit=this.ray.intersectObjects(this.tiles,false);
    return hit.length?hit[0].object.userData:null;
  },

  loop(now){
    if(!this.ok) return;
    requestAnimationFrame(t=>this.loop(t));
    const dt=this._last?Math.min(60,now-this._last):16; this._last=now;
    this.anims=this.anims.filter(a=>{ a.t+=dt; const k=Math.min(1,a.t/a.dur); a.fn(k); return k<1; });
    this.puffs=this.puffs.filter(p=>{
      p.m.position.x+=p.vx; p.m.position.y+=p.vy; p.m.position.z+=p.vz;
      p.vy-=0.0016; p.life-=0.022;
      p.m.material.opacity=Math.max(0,p.life*0.75);
      p.m.scale.multiplyScalar(1.012);
      if(p.life<=0){ this.fxGroup.remove(p.m); return false; }
      return true;
    });
    if(this.shake>0.002){
      this.cam.position.x=this.camHome.x+(Math.random()-.5)*this.shake;
      this.cam.position.z=this.camHome.z+(Math.random()-.5)*this.shake;
      this.cam.lookAt(0,0,0.6);
      this.shake*=0.87;
    }
    this.ren.render(this.scene,this.cam);
  },
  resize(){
    if(!this.ok) return;
    const host=document.getElementById('view');
    const w=host.clientWidth, h=host.clientHeight;
    this.cam.aspect=w/h; this.cam.updateProjectionMatrix(); this.ren.setSize(w,h);
  }
};
window.addEventListener('resize',()=>V.resize());

/* ══════════ 遊戲流程 ══════════ */
const G={
  grid:[], es:[], turn:0, sel:null, used:{}, ghost:null, ghostLeft:0, busy:false,
  el(id){return document.getElementById(id)},
  go(n){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
    this.el('s-'+n).classList.add('on'); window.scrollTo(0,0);
    if(n==='play') setTimeout(()=>V.resize(),50);},

  async start(){
    S.tap(); this.go('play');
    const ok = await V.boot();
    if(!ok){
      document.getElementById('view').innerHTML =
        '<div id="loading"><div class="err">3D 引擎載不起來（可能網路被擋）。<br>' +
        '可以先玩 2D 版：proto5.html</div></div>';
      return;
    }
    V.resize();
    this.grid=MAP0.map(r=>r.split(''));
    this.es=START.map((e,i)=>({x:e.x,y:e.y,sleep:0,id:i}));
    this.turn=0; this.sel=null; this.used={}; this.ghost=null; this.ghostLeft=0; this.busy=false;
    V.reset(this.grid); V.clearGhost();
    this.es.forEach(e=>V.addEnemy(e));
    if(!V._looping){ V._looping=1; requestAnimationFrame(t=>V.loop(t)); }
    this.say('選一位偉人，或直接跳過這回合');
    this.refresh();
  },
  say(t){ this.el('say').textContent=t; },
  avoidSet(){
    const a=new Set();
    if(this.ghostLeft>0&&this.ghost){
      [[1,0],[-1,0],[0,1],[0,-1],[0,0]].forEach(([dx,dy])=>{
        const nx=this.ghost.x+dx, ny=this.ghost.y+dy;
        if(nx<0||ny<0||nx>=W||ny>=H) return;
        if(nx===CITY.x&&ny===CITY.y) return;
        a.add(key(nx,ny));
      });
    }
    return a;
  },
  refresh(){
    const box=this.el('heroes'); box.innerHTML='';
    HEROES.forEach(h=>{
      const d=document.createElement('div');
      d.className='h'+(this.sel===h.id?' on':'')+(this.used[h.id]?' used':'');
      d.innerHTML='<b>'+h.n+'</b><i>'+h.s+'</i><u>'+h.d+'</u>';
      d.onclick=()=>{ if(this.busy)return; S.tap();
        this.sel=this.sel===h.id?null:h.id;
        this.say(this.sel?(h.target==='enemy'?'點一個敵人':'點地上的一格'):'選一位偉人');
        this.refresh(); };
      box.appendChild(d);
    });
    const tb=this.el('turnbar'); tb.innerHTML='';
    for(let i=0;i<TURNS;i++){const e=document.createElement('i');
      if(i<this.turn)e.className='done'; else if(i===this.turn)e.className='now'; tb.appendChild(e);}
    this.el('turnTxt').textContent='第 '+(this.turn+1)+' 回合　／　共 '+TURNS+' 回合';
    // 箭頭
    const avoid=this.avoidSet();
    this.es.forEach((e,i)=>{
      if(e.sleep>0){ V.setArrow(i,0,0,false); return; }
      const n=nextStep(this.grid,e,avoid);
      if(n) V.setArrow(i,n.x-e.x,n.y-e.y,true); else V.setArrow(i,0,0,false);
    });
    // 可點的格子
    if(this.sel){
      const h=HEROES.find(k=>k.id===this.sel);
      const list=[];
      for(let y=0;y<H;y++)for(let x=0;x<W;x++){
        if(h.target==='cell'){
          if(this.grid[y][x]==='.'&&!(x===CITY.x&&y===CITY.y)&&!this.es.some(e=>e.x===x&&e.y===y)) list.push({x,y});
        }else if(this.es.some(e=>e.x===x&&e.y===y&&e.sleep===0)) list.push({x,y});
      }
      V.highlight(list);
    } else V.highlight([]);
  },

  tapCell(x,y){
    if(this.busy) return;
    const h=HEROES.find(k=>k.id===this.sel);
    if(!h){ this.say('先選一位偉人'); return; }
    if(h.target==='enemy'){
      const i=this.es.findIndex(e=>e.x===x&&e.y===y&&e.sleep===0);
      if(i<0){ this.say('要點在敵人身上'); return; }
      this.es[i].sleep=2;
      V.heroAct('huatuo', ()=> V.throwGourd(i, ()=>{ V.sleepEnemy(i); S.sleep(); }));
      this.commit(h,1150); return;
    }
    if(x===CITY.x&&y===CITY.y){ this.say('不能蓋在城上面'); return; }
    if(this.grid[y][x]==='#'){ this.say('那裡已經是牆了'); return; }
    if(this.es.some(e=>e.x===x&&e.y===y)){ this.say('那格站著人'); return; }
    if(h.id==='imhotep'){
      this.grid[y][x]='#';
      V.heroAct('imhotep', ()=>{ V.addWall(x,y,true); S.build(); });
      this.commit(h,1250);
    } else {
      this.ghost={x,y}; this.ghostLeft=2;
      V.heroAct('zhugeliang', ()=>{ V.showGhost([...this.avoidSet()],{x,y}); S.ghost(); });
      this.commit(h,1200);
    }
  },
  commit(h,wait){
    this.used[h.id]=1; this.sel=null; this.busy=true;
    this.say(h.n+' 使出　'+h.s);
    V.highlight([]);
    setTimeout(()=>this.enemyTurn(), wait||900);
  },
  pass(){ if(this.busy)return; S.tap(); this.sel=null; this.busy=true;
    this.say('按兵不動'); V.highlight([]);
    setTimeout(()=>this.enemyTurn(), 350); },

  enemyTurn(){
    const avoid=this.avoidSet();
    if(this.ghostLeft>0){ this.ghostLeft--; if(this.ghostLeft===0) V.clearGhost(); }
    let lost=false;
    this.es.forEach((e,i)=>{
      if(e.sleep>0){ e.sleep--; if(e.sleep===0) V.wakeEnemy(i); return; }
      const n=nextStep(this.grid,e,avoid);
      if(n){ e.x=n.x; e.y=n.y; V.moveEnemy(i,n.x,n.y); S.step(); }
      if(e.x===CITY.x&&e.y===CITY.y) lost=true;
    });
    setTimeout(()=>{
      this.busy=false;
      if(lost){ this.end(false); return; }
      this.turn++;
      if(this.turn>=TURNS){ this.end(true); return; }
      this.say('選一位偉人，或直接跳過這回合');
      this.refresh();
    }, 520);
  },

  end(win){
    S[win?'win':'lose']();
    V.shake=win?0.1:0.4;
    this.el('endTxt').textContent=win?'守 住 了':'城 破 了';
    this.el('endTxt').style.color=win?'var(--gold)':'var(--cinnabar)';
    this.el('endSub').textContent=win
      ? '五回合撐過去了。這一關十萬種下法裡只有 7.4% 能贏。'
      : '敵人衝進城了。提示：先看清楚箭頭往哪走，再決定擋哪一格。';
    const box=this.el('facts'); box.innerHTML='';
    if(win) HEROES.forEach(h=>{
      const d=document.createElement('div'); d.className='fact';
      d.innerHTML='<b>'+h.n+'・'+h.s+'</b>'+h.f; box.appendChild(d);
    });
    setTimeout(()=>this.go('end'), 600);
  }
};
document.getElementById('view').addEventListener('click',ev=>{
  const c=V.pick(ev); if(c) G.tapCell(c.x,c.y);
});
document.addEventListener('gesturestart',e=>e.preventDefault());
</script>
