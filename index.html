<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="六格見方">
<meta name="theme-color" content="#12151c">
<meta name="description" content="八位史書有載的偉人，八個只能用地圖表示的獨門絕活。五關戰術解謎。">
<title>六格見方</title>
<style>
:root{--ink:#12151c;--slate:#1d222d;--line:#2c3342;--paper:#e6ddcb;
  --cinnabar:#b5342b;--gold:#c9a227;--jade:#2f8f74;--dim:#8b93a4;
  --serif:"Noto Serif TC","Songti TC","Source Han Serif TC",serif;
  --sans:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ink);color:#e8e0cf;font-family:var(--sans);
  background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.014) 0 2px,transparent 2px 7px);
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:480px;margin:0 auto;padding:10px 12px 22px}
.screen{display:none}.screen.on{display:block;animation:f .25s}
@keyframes f{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
h1{font-family:var(--serif);font-size:clamp(30px,10vw,44px);letter-spacing:.2em;
  text-align:center;margin:24px 0 4px;text-indent:.2em}
.sub{text-align:center;color:var(--dim);font-size:12px;letter-spacing:.2em;margin-bottom:14px}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:12px 0}
.btn{display:block;width:100%;padding:14px;margin:8px 0;border:1px solid var(--line);
  background:var(--slate);color:#e8e0cf;font-family:var(--serif);font-size:17px;
  letter-spacing:.1em;border-radius:3px;cursor:pointer;text-align:center}
.btn.main{background:var(--cinnabar);border-color:#8f2820;color:#fff4ec}
.btn.go{background:var(--gold);border-color:#9c7d1c;color:#20180a;font-weight:700}
.btn small{display:block;font-family:var(--sans);font-size:12px;letter-spacing:0;color:var(--dim);margin-top:3px}
.btn.main small{color:rgba(255,255,255,.72)}.btn.go small{color:rgba(32,24,10,.7)}
.hint{color:var(--dim);font-size:13px;line-height:1.9;margin:8px 0}
.topbar{display:flex;justify-content:space-between;align-items:center;
  font-size:12px;color:var(--dim);letter-spacing:.08em;margin-bottom:7px}
.topbar button{background:none;border:none;color:var(--dim);font-size:12px;cursor:pointer}
.turnbar{display:flex;gap:4px;margin-bottom:8px}
.turnbar i{flex:1;height:4px;background:var(--line);border-radius:2px}
.turnbar i.done{background:var(--jade)}.turnbar i.now{background:var(--gold)}
#view{width:100%;aspect-ratio:1/0.95;border-radius:4px;overflow:hidden;
  background:#161a22;border:1px solid #3a3f4d;position:relative;touch-action:none}
#view canvas{display:block;width:100%;height:100%}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--dim);font-size:13px;padding:20px;text-align:center}
.say{text-align:center;font-size:13.5px;color:var(--gold);font-family:var(--serif);
  letter-spacing:.04em;margin:9px 0 4px;min-height:22px;line-height:1.5}
.tipline{text-align:center;font-size:11.5px;color:var(--dim);margin-bottom:7px}
.heroes{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.h{background:var(--slate);border:1px solid var(--line);border-radius:3px;padding:9px 5px;
  text-align:center;cursor:pointer;transition:.12s}
.h.on{border-color:var(--gold);background:#2a2413}
.h.used{opacity:.26;pointer-events:none}
.h b{font-family:var(--serif);font-size:13.5px;display:block;letter-spacing:.02em;line-height:1.25}
.h i{font-style:normal;font-size:11px;color:var(--gold);display:block;margin-top:3px}
.h u{text-decoration:none;font-size:10.5px;color:var(--dim);display:block;margin-top:4px;line-height:1.45}
.lv{background:var(--slate);border:1px solid var(--line);border-radius:3px;padding:12px;
  margin:7px 0;cursor:pointer}
.lv.lock{opacity:.32;pointer-events:none}
.lv b{font-family:var(--serif);font-size:16px;letter-spacing:.06em;display:block}
.lv span{font-size:11.5px;color:var(--dim);display:block;margin-top:4px}
.big{text-align:center;font-family:var(--serif);font-size:31px;letter-spacing:.16em;margin:20px 0 6px}
.fact{background:var(--slate);border-left:3px solid var(--gold);padding:10px 12px;margin:7px 0;
  font-size:12.5px;line-height:1.8;border-radius:0 3px 3px 0}
.fact b{font-family:var(--serif);font-size:14px;display:block;margin-bottom:3px;letter-spacing:.05em}
.err{background:#2a1414;border:1px solid #5a2f2a;border-radius:4px;padding:11px;
  font-size:12.5px;line-height:1.7;color:#e8b0a6}
</style>
</head>
<body>
<div class="wrap">

<section id="s-title" class="screen on">
  <h1>六格見方</h1>
  <div class="sub">歷 史 戰 術 解 謎</div>
  <div class="rule"></div>
  <p class="hint">
    敵人要衝進「城」。<b style="color:#e8e0cf">你要撐過規定的回合數。</b><br><br>
    每一位偉人有一個獨門絕活，<b style="color:var(--gold)">一關只能用一次</b>。<br>
    敵人下一步走哪，箭頭直接畫在地上——<b style="color:#e8e0cf">沒有運氣，全是算的。</b>
  </p>
  <button class="btn main" onclick="G.menu()">開始<small>五關，每關三十秒到三分鐘</small></button>
  <button class="btn" onclick="G.go('who')">八位偉人<small>他們各自會什麼</small></button>
  <p class="hint" style="text-align:center;font-size:11.5px;margin-top:12px">
    立體場景全部由程式堆成，零模型檔。
  </p>
</section>

<section id="s-who" class="screen">
  <div class="topbar"><span>八位偉人</span><button onclick="G.go('title')">返回</button></div>
  <div class="rule"></div>
  <div id="whoList"></div>
  <p class="hint">收錄標準：史書有記載、留下的東西讓後人受益。侵略者、屠殺者、神話人物不收。</p>
  <button class="btn main" onclick="G.go('title')">知道了</button>
</section>

<section id="s-menu" class="screen">
  <div class="topbar"><span>選關卡</span><button onclick="G.go('title')">返回</button></div>
  <div class="rule"></div>
  <div id="lvList"></div>
</section>

<section id="s-play" class="screen">
  <div class="topbar"><span id="lvName">—</span><span id="turnTxt" style="color:var(--gold)"></span><button onclick="G.menu()">放棄</button></div>
  <div class="turnbar" id="turnbar"></div>
  <div id="view"><div id="loading">正在搭建場景⋯⋯</div></div>
  <div class="say" id="say">選一位偉人</div>
  <div class="tipline" id="tip"></div>
  <div class="heroes" id="heroes"></div>
  <button class="btn" onclick="G.pass()">這回合什麼都不做</button>
  <div style="display:flex;gap:7px">
    <button class="btn" style="margin:0" onclick="G.start(G.lv)">重來這關</button>
  </div>
</section>

<section id="s-end" class="screen">
  <div class="big" id="endTxt">—</div>
  <p class="hint" id="endSub" style="text-align:center"></p>
  <div class="rule"></div>
  <div id="facts"></div>
  <button class="btn go" id="nextBtn" style="display:none">下一關</button>
  <button class="btn main" id="retryBtn">再解一次</button>
  <button class="btn" onclick="G.menu()">回關卡表</button>
</section>

</div>
<script>
/* ══════════════════════════════════════════════
   六格見方　規則引擎（純邏輯，沒有任何畫面）
   這一份會原封不動內嵌進遊戲檔，確保「驗證的」與「玩到的」是同一套
   ══════════════════════════════════════════════ */

// ---- 八位偉人，每人一個「只能用地圖表示」的獨門招 ----
const HERO_DB = {
  imhotep:   {n:'印和闐',   j:'工匠',   s:'階梯金字塔', t:'cell',
    d:'指定一格，永久變成牆',
    f:'他蓋了世界第一座金字塔，後來埃及人乾脆把他當成神來拜。'},
  huatuo:    {n:'華佗',     j:'醫者',   s:'麻沸散',     t:'enemy',
    d:'指定一個敵人，睡兩回合',
    f:'他用麻沸散讓病人睡著再開刀，是最早的麻醉紀錄之一。'},
  zhugeliang:{n:'諸葛亮',   j:'軍師',   s:'空城計',     t:'cell',
    d:'指定一格，兩回合內敵人不敢靠近它的上下左右',
    f:'他大開城門獨自撫琴，司馬懿疑心有埋伏，帶兵撤了。'},
  zhangheng: {n:'張衡',     j:'科學家', s:'地動儀',     t:'none',
    d:'大地一震，所有敵人被震退一格',
    f:'他做的地動儀，在洛陽就偵測到幾百公里外的地震。'},
  zhangfei:  {n:'張飛',     j:'武將',   s:'當陽怒吼',   t:'cell',
    d:'指定一格，旁邊的敵人被嚇退兩格',
    f:'長坂坡上他一個人斷後，曹操大軍沒人敢上前。'},
  zhenghe:   {n:'鄭和',     j:'航海家', s:'寶船遠航',   t:'enemy',
    d:'指定一個敵人，把他送到離城最遠的地方',
    f:'他的船隊有兩百多艘船，比哥倫布早了將近一百年出海。'},
  libai:     {n:'李白',     j:'文人',   s:'斗酒百篇',   t:'enemy',
    d:'指定一個敵人，灌醉他，兩回合往反方向走',
    f:'杜甫寫他：喝一斗酒能作一百首詩，醉倒在長安的酒店裡。'},
  elizabeth1:{n:'伊莉莎白一世', j:'君王', s:'女王詔令', t:'cell',
    d:'指定一格，第一個踏進去的敵人停一回合',
    f:'她一輩子不結婚，說「我已經嫁給英格蘭了」。'}
};

// ---- 五個關卡 ----
// map: . 空地  # 牆  C 城
const LEVELS = [
  { id:1, name:'長坂坡',  turns:5,
    map:['......','.####.','C.....','.####.','......','......'],
    enemies:[{x:4,y:2},{x:1,y:5}],
    heroes:['imhotep','huatuo','zhugeliang'],
    tip:'走廊只有一條，堵住它。' },
  { id:2, name:'醉臥長安', turns:6,
    map:['..#...','..#...','C.....','..#...','.....#','......'],
    enemies:[{x:3,y:2},{x:2,y:5}],
    heroes:['libai','huatuo','elizabeth1'],
    tip:'灌醉的人會往反方向走，等於倒退。' },
  { id:3, name:'八陣圖',  turns:6,
    map:['......','.#.#..','C.....','.#.#..','......','......'],
    enemies:[{x:4,y:2},{x:5,y:0},{x:4,y:5}],
    heroes:['zhugeliang','zhangheng','elizabeth1'],
    tip:'空城計擋兩回合，地動儀把所有人一起震退。' },
  { id:4, name:'洛陽城下', turns:5,
    map:['......','..##..','C.....','..##..','......','......'],
    enemies:[{x:3,y:2},{x:0,y:5},{x:5,y:1}],
    heroes:['zhangheng','imhotep','zhangfei'],
    tip:'地動儀能一次震退所有人。' },
  { id:5, name:'寶船入港', turns:6,
    map:['......','.#..#.','C.....','.#..#.','......','......'],
    enemies:[{x:2,y:2},{x:4,y:4},{x:4,y:0}],
    heroes:['zhenghe','zhugeliang','imhotep'],
    tip:'寶船能把一個人整個丟到天邊。' }
];

// ══════════ 引擎 ══════════
function makeEngine(level){
  const W=6, H=6;
  const key=(x,y)=>y*W+x;
  let city=null;
  level.map.forEach((row,y)=>row.split('').forEach((c,x)=>{ if(c==='C') city={x,y}; }));

  function fresh(){
    return {
      grid: level.map.map(r=>r.split('').map(c=>c==='#'?'#':'.')),
      es: level.enemies.map((e,i)=>({x:e.x,y:e.y,i, sleep:0, drunk:0, stop:0})),
      fear:null, fearLeft:0,     // 空城計
      decree:null,               // 女王詔令
      turn:0, over:null
    };
  }
  const isWall=(g,x,y)=> x<0||y<0||x>=W||y>=H||g[y][x]==='#';

  function distFrom(g, tx, ty, avoid){
    const q=[[tx,ty]], d={}; d[key(tx,ty)]=0;
    while(q.length){
      const [x,y]=q.shift();
      [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{
        const nx=x+dx, ny=y+dy;
        if(isWall(g,nx,ny)) return;
        if(avoid && avoid.has(key(nx,ny))) return;
        if(d[key(nx,ny)]!==undefined) return;
        d[key(nx,ny)]=d[key(x,y)]+1; q.push([nx,ny]);
      });
    }
    return d;
  }
  function fearSet(st){
    const a=new Set();
    if(st.fearLeft>0 && st.fear){
      [[1,0],[-1,0],[0,1],[0,-1],[0,0]].forEach(([dx,dy])=>{
        const nx=st.fear.x+dx, ny=st.fear.y+dy;
        if(nx<0||ny<0||nx>=W||ny>=H) return;
        if(nx===city.x&&ny===city.y) return;    // 城本身不受影響
        a.add(key(nx,ny));
      });
    }
    return a;
  }
  // 敵人這一步要走哪（drunk 的話往遠離城的方向）
  function nextStep(st, e){
    const avoid=fearSet(st);
    const d=distFrom(st.grid, city.x, city.y, avoid);
    const here=d[key(e.x,e.y)];
    let best=null, bv = e.drunk>0 ? -1 : 1e9;
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{
      const nx=e.x+dx, ny=e.y+dy;
      if(isWall(st.grid,nx,ny)) return;
      if(avoid.has(key(nx,ny))) return;
      if(st.es.some(o=>o!==e && o.x===nx && o.y===ny)) return;   // 不重疊
      const v=d[key(nx,ny)];
      if(v===undefined) return;
      if(e.drunk>0 ? v>bv : v<bv){ bv=v; best={x:nx,y:ny}; }
    });
    if(e.drunk>0 && best && here!==undefined && bv<=here) return null;  // 醉了但無路可退就不動
    return best;
  }

  // 把一個敵人往遠離 (fx,fy) 的方向推 n 格
  function push(st, e, fx, fy, n){
    for(let s=0;s<n;s++){
      const dx=Math.sign(e.x-fx), dy=Math.sign(e.y-fy);
      const cand=[];
      if(dx) cand.push({x:e.x+dx,y:e.y});
      if(dy) cand.push({x:e.x,y:e.y+dy});
      if(!dx&&!dy) cand.push({x:e.x+1,y:e.y},{x:e.x-1,y:e.y},{x:e.x,y:e.y+1},{x:e.x,y:e.y-1});
      let moved=false;
      for(const c of cand){
        if(isWall(st.grid,c.x,c.y)) continue;
        if(c.x===city.x&&c.y===city.y) continue;
        if(st.es.some(o=>o!==e&&o.x===c.x&&o.y===c.y)) continue;
        e.x=c.x; e.y=c.y; moved=true; break;
      }
      if(!moved) break;
    }
  }

  // 出招
  function act(st, a){
    if(!a) return true;
    const h=HERO_DB[a.id];
    if(!h) return false;
    if(h.t==='cell'){
      if(a.x===city.x&&a.y===city.y) return false;
      if(st.grid[a.y][a.x]==='#') return false;
      if(a.id!=='zhangfei' && a.id!=='elizabeth1' && st.es.some(e=>e.x===a.x&&e.y===a.y)) return false;
    }
    if(h.t==='enemy'){
      const e=st.es[a.i];
      if(!e || e.sleep>0) return false;
    }
    switch(a.id){
      case 'imhotep':    st.grid[a.y][a.x]='#'; break;
      case 'huatuo':     st.es[a.i].sleep=2; break;
      case 'zhugeliang': st.fear={x:a.x,y:a.y}; st.fearLeft=2; break;
      case 'zhangheng':  st.es.forEach(e=>{ if(e.sleep===0) push(st,e,city.x,city.y,1); }); break;
      case 'zhangfei':   st.es.forEach(e=>{
                           if(Math.abs(e.x-a.x)+Math.abs(e.y-a.y)<=1) push(st,e,a.x,a.y,2);
                         }); break;
      case 'zhenghe': {
        const e=st.es[a.i];
        const d=distFrom(st.grid, city.x, city.y, null);
        let far=null, fv=-1;
        for(let y=0;y<H;y++)for(let x=0;x<W;x++){
          if(isWall(st.grid,x,y)) continue;
          if(st.es.some(o=>o!==e&&o.x===x&&o.y===y)) continue;
          const v=d[key(x,y)];
          if(v!==undefined && v>fv){ fv=v; far={x,y}; }
        }
        if(far){ e.x=far.x; e.y=far.y; }
        break;
      }
      case 'libai':      st.es[a.i].drunk=2; break;
      case 'elizabeth1': st.decree={x:a.x,y:a.y}; break;
    }
    return true;
  }

  // 敵人行動一次
  function enemyPhase(st){
    if(st.fearLeft>0) st.fearLeft--;
    for(const e of st.es){
      if(e.stop>0){ e.stop--; continue; }
      if(e.sleep>0){ e.sleep--; continue; }
      const n=nextStep(st,e);
      if(n){ e.x=n.x; e.y=n.y; }
      if(e.drunk>0) e.drunk--;
      if(st.decree && e.x===st.decree.x && e.y===st.decree.y){ e.stop=1; st.decree=null; }
      if(e.x===city.x && e.y===city.y) return false;   // 城破
    }
    return true;
  }

  function run(actions){
    const st=fresh();
    for(let t=0;t<level.turns;t++){
      if(!act(st, actions[t])) return {win:false, illegal:true};
      if(!enemyPhase(st)) return {win:false};
      st.turn++;
    }
    return {win:true};
  }

  // 這一關這回合所有合法的出招（給窮舉與 UI 用）
  function options(st, remaining){
    const out=[null];
    remaining.forEach(id=>{
      const h=HERO_DB[id];
      if(h.t==='none'){ out.push({id}); return; }
      if(h.t==='enemy'){ st.es.forEach((e,i)=>{ if(e.sleep===0) out.push({id,i}); }); return; }
      for(let y=0;y<H;y++)for(let x=0;x<W;x++){
        if(st.grid[y][x]==='#') continue;
        if(x===city.x&&y===city.y) continue;
        if(id!=='zhangfei'&&id!=='elizabeth1'&&st.es.some(e=>e.x===x&&e.y===y)) continue;
        out.push({id,x,y});
      }
    });
    return out;
  }

  return { W,H,city,fresh,isWall,distFrom,fearSet,nextStep,act,enemyPhase,run,options,level };
}



/* ══════════ 立體場景（Three.js，基本幾何堆成，零模型檔）══════════ */
const V = {
  ok:false, T:null, scene:null, cam:null, ren:null, ray:null,
  tiles:[], walls:{}, enemies:[], heroes:{}, marks:{}, ghostGroup:null,
  hi:[], anims:[], puffs:[], rings:[], shake:0, _last:0, _loop:0,

  async boot(){
    if(this.ok) return true;
    const CDNS=[
      'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
      'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js',
      'https://unpkg.com/three@0.128.0/build/three.min.js'
    ];
    for(const url of CDNS){
      try{
        await new Promise((res,rej)=>{ const sc=document.createElement('script');
          sc.src=url; sc.onload=res; sc.onerror=()=>rej(0); document.head.appendChild(sc); });
        if(window.THREE){ this.T=window.THREE; break; }
      }catch(e){}
    }
    if(!this.T) return false;
    this.build(); this.ok=true; return true;
  },

  build(){
    const T=this.T, host=document.getElementById('view');
    const w=host.clientWidth||360, h=host.clientHeight||340;
    this.scene=new T.Scene();
    this.scene.background=new T.Color(0x11141b);

  /* ---------- 人物：有身體結構的水墨小人 ----------

  lathe(pts, seg, matr){
    const T=this.T;

  makeFigure(cfg){
    const T=this.T, g=new T.Group();
    const skin=this.mat(cfg.skin||0xd9b48a,.62);
    const robeM=this.mat(cfg.robe,.82);
    const robe2M=this.mat(cfg.robe2||cfg.robe,.78);

    // 袍身：旋轉曲面，下擺自然外張
    const robe=this.lathe([[0.045,0],[0.40,0.03],[0.375,0.10],[0.30,0.34],
      [0.235,0.60],[0.195,0.80],[0.185,0.88]],16,robeM);
    robe.castShadow=true; robe.receiveShadow=true; g.add(robe);

    const sash=new T.Mesh(new T.TorusGeometry(0.245,0.032,8,18), robe2M);
    sash.position.y=0.55; sash.rotation.x=Math.PI/2; sash.castShadow=true; g.add(sash);
    // 前襟
    const lapel=new T.Mesh(new T.BoxGeometry(0.1,0.42,0.02), robe2M);
    lapel.position.set(0,0.66,0.2); lapel.rotation.x=-0.12; g.add(lapel);
    // 腳（從袍擺下面露一點）
    [-1,1].forEach(sd=>{ const f=new T.Mesh(new T.BoxGeometry(0.12,0.06,0.2), this.mat(0x2e2823,.9));

    // 眼睛（兩顆小點，有沒有差很多）
    [-1,1].forEach(sd=>{ const e=new T.Mesh(new T.SphereGeometry(0.019,8,6), this.mat(0x14100e,.4));
      e.position.set(sd*0.052,0.012,0.132); head.add(e); });

    // 兩隻手臂：肩關節 → 上臂 → 手
    function arm(side){
      const j=new T.Group(); j.position.set(side*0.215,0.86,0.02); g.add(j);
      const sleeve=this.lathe([[0.0,0],[0.105,0.02],[0.115,0.16],[0.075,0.30]],12,robeM);
      sleeve.rotation.x=Math.PI; sleeve.castShadow=true; j.add(sleeve);
      const upper=new T.Mesh(new T.CylinderGeometry(0.045,0.04,0.34,8), robeM);

      j.rotation.z=side*0.16;
      return {joint:j, hand};
    }
    const R=arm.call(this,1), L=arm.call(this,-1);

    // 頭上的東西
    switch(cfg.hat){
      case 'tall':{ const b=this.lathe([[0.0,0],[0.19,0.01],[0.185,0.19],[0.14,0.26],[0.0,0.27]],14,this.mat(0x232833,.88));

        c2.position.y=0.1; c2.castShadow=true; head.add(c2); break; }
      case 'warhelm':{
        const hm=this.lathe([[0.0,0],[0.185,0.02],[0.17,0.14],[0.09,0.22],[0.0,0.24]],14,this.mat(0x4e535a,.4));

      case 'band':{ const b=new T.Mesh(new T.TorusGeometry(0.152,0.026,8,18), this.mat(0x8a3b3b,.8));
        b.position.y=0.06; b.rotation.x=Math.PI/2; head.add(b);
        const tail=new T.Mesh(new T.BoxGeometry(0.028,0.3,0.014), this.mat(0x8a3b3b,.8));

      case 'crown':{
        const rf=this.lathe([[0.1,0],[0.3,0.05],[0.3,0.1],[0.1,0.13]],20,this.mat(0xf6f2e8,.92));
        rf.position.y=0.86; rf.castShadow=true; g.add(rf);
        const cr=new T.Mesh(new T.CylinderGeometry(0.15,0.155,0.075,14), this.mat(0xc9a227,.28));

        for(let i=0;i<6;i++){ const sp=new T.Mesh(new T.ConeGeometry(0.03,0.13,6), this.mat(0xc9a227,.28));
          const an=i/6*6.283; sp.position.set(Math.cos(an)*0.115,0.22,Math.sin(an)*0.115); head.add(sp); }
        const jew=new T.Mesh(new T.OctahedronGeometry(0.035), this.mat(0xb5342b,.3,0x3a0a06));
        jew.position.set(0,0.17,0.15); head.add(jew); break; }
      case 'helm2':{
        const hm=this.lathe([[0.0,0],[0.18,0.02],[0.165,0.13],[0.08,0.2],[0.0,0.22]],14,this.mat(0x6b6f78,.45));
        hm.position.y=0.08; hm.castShadow=true; head.add(hm);
        const pl=new T.Mesh(new T.ConeGeometry(0.045,0.24,6), this.mat(0xd6402f,.6,0x2a0a06));

    if(cfg.beard){
      const big=cfg.bigBeard;
      const b=this.lathe(big?[[0.0,0],[0.14,0.04],[0.12,0.2],[0.0,0.34]]:[[0.0,0],[0.095,0.03],[0.075,0.16],[0.0,0.27]],
        12,this.mat(cfg.beard,.9));
      b.position.set(0,-0.3,0.05); b.rotation.x=Math.PI; head.add(b);
      const mo=new T.Mesh(new T.BoxGeometry(0.1,0.022,0.03), this.mat(cfg.beard,.9));
      mo.position.set(0,-0.03,0.13); head.add(mo);

    // 信物掛在右手上，抬手時會一起動
    const prop=new T.Group(); R.hand.add(prop);
    switch(cfg.prop){
      case 'rod':{ const r=new T.Mesh(new T.CylinderGeometry(0.028,0.032,1.2,8), this.mat(0xb08a4a,.7));

          const t=new T.Mesh(new T.TorusGeometry(0.185,0.016,8,24), this.mat(0xa88a42,.45));
          t.position.y=0.3; t.rotation.set(rx,ry,rz); t.castShadow=true; prop.add(t); });
        const st=new T.Mesh(new T.CylinderGeometry(0.022,0.026,0.3,6), this.mat(0x6b5a3a,.8));
        st.position.y=0.05; prop.add(st);
        const bs=new T.Mesh(new T.CylinderGeometry(0.08,0.09,0.03,10), this.mat(0x6b5a3a,.8));

          w.position.set(i%2?0.042:-0.042, 1.0+i*0.075, 0); w.rotation.z=(i%2?1:-1)*0.55; prop.add(w); }
        const tip=new T.Mesh(new T.ConeGeometry(0.055,0.22,8), this.mat(0xdadee5,.22));
        tip.position.y=1.42; prop.add(tip);
        const tas=new T.Mesh(new T.ConeGeometry(0.05,0.14,8), this.mat(0xb5342b,.7));

      case 'sail':{

  reset(level, st){
    const T=this.T;
    [this.tileGroup,this.objGroup,this.fxGroup].forEach(G=>{ while(G.children.length) G.remove(G.children[0]); });
    this.tiles=[]; this.walls={}; this.enemies=[]; this.heroes={}; this.marks={};
    this.hi=[]; this.anims=[]; this.puffs=[]; this.rings=[]; this.ghostGroup=null;
    let city=null;
    level.map.forEach((r,y)=>r.split('').forEach((c,x)=>{ if(c==='C') city={x,y}; }));
    const tileGeo=new T.BoxGeometry(0.92,0.14,0.92);
    for(let y=0;y<6;y++)for(let x=0;x<6;x++){
      const p=this.pos(x,y), isC=(x===city.x&&y===city.y);
      const m=new T.Mesh(tileGeo, this.mat(isC?0x6b5a24:0xd9d0bb,.9));
      m.position.set(p.x,0,p.z); m.receiveShadow=true; m.userData={x,y};
      this.tileGroup.add(m); this.tiles.push(m);
      if(level.map[y][x]==='#') this.addWall(x,y,false);
    }
    const g=new T.Group(), p=this.pos(city.x,city.y);
    const gm=new T.MeshStandardMaterial({color:0xc9a227,roughness:.42,metalness:.28});
    [[-0.3,0.5,0.2,0.9,0.2],[0.3,0.5,0.2,0.9,0.2],[0,1.02,0.92,0.18,0.3]].forEach(([px,py,sx,sy,sz])=>{
      const b=new T.Mesh(new T.BoxGeometry(sx,sy,sz),gm); b.position.set(px,py,0); b.castShadow=true; g.add(b); });
    g.position.set(p.x,0,p.z); this.objGroup.add(g);
    // 三位偉人站在城後面
    level.heroes.forEach((id,i)=>{
      const f=this.makeFigure(this.FIG[id]||this.FIG.imhotep);
      f.position.set(-4.0, 0, (i-1)*1.1+0.3);
      f.rotation.y=Math.PI/2;
      f.userData.home={x:f.position.x,z:f.position.z};
      this.objGroup.add(f); this.heroes[id]=f;
    });

  },

  heroAct(id, then){
    const f=this.heroes[id];
    if(!f){ then&&then(); return; }
    const u=f.userData, home=u.home;
    this.anims.push({t:0,dur:620,fn:(k)=>{
      // 前半段抬手蓄勢，後半段揮下
      const up=Math.min(1,k/0.45), down=Math.max(0,(k-0.45)/0.55);
      const e=Math.sin(k*Math.PI);
      f.position.x=home.x+e*0.55;
      u.baseY=e*0.06;
      f.rotation.z=-e*0.09;
      u.armR.rotation.x=-up*1.5+down*0.7;      // 舉起再放下
      u.armR.rotation.z=0.16-up*0.35;
      u.armL.rotation.x=up*0.5;
      u.robe.rotation.y=Math.sin(k*Math.PI*2)*0.12;
      if(k>=1){ f.position.x=home.x; f.rotation.z=0; u.baseY=0;
        u.armR.rotation.set(0,0,0.16); u.armL.rotation.set(0,0,-0.16); u.robe.rotation.y=0; }
    }});
    setTimeout(()=>then&&then(), 340);
  },

  /* 華佗：葫蘆從手上拋出去，砸中敵人冒綠煙 */
  throwGourd(i, done){
    const T=this.T, o=this.enemies[i];
    const h=this.heroes['huatuo'];
    if(!o||!h){ done&&done(); return; }
    const from=new T.Vector3(h.position.x+0.4,1.05,h.position.z);
    const to=new T.Vector3(o.g.position.x,1.0,o.g.position.z);
    const ball=new T.Group();
    const gd=this.lathe([[0.0,0],[0.13,0.04],[0.11,0.14],[0.06,0.2],[0.08,0.27],[0.05,0.34],[0.0,0.36]],
      12,this.mat(0x3f9aa8,.55));
    gd.position.y=-0.16; ball.add(gd);
    const cap=new T.Mesh(new T.CylinderGeometry(0.04,0.05,0.055,8), this.mat(0x8a6a3a,.8));
    cap.position.y=0.2; ball.add(cap);
    ball.position.copy(from); this.fxGroup.add(ball);
    this.anims.push({t:0,dur:520,fn:(k)=>{
      ball.position.x=from.x+(to.x-from.x)*k;
      ball.position.z=from.z+(to.z-from.z)*k;
      ball.position.y=from.y+(to.y-from.y)*k+Math.sin(k*Math.PI)*1.7;
      ball.rotation.x+=0.3; ball.rotation.z+=0.22;

        this.fxGroup.remove(ball);
        this.dust(to.x,to.z,36,0x6fd0b0,0.7);
        this.ring(to.x,to.z,0x6fd0b0,1.9);
        this.flash(to.x,1.0,to.z,0x6fd0b0,2.2);

  addWall(x,y,built){

      const cap=new T.Mesh(new T.TetrahedronGeometry(0.16), this.mat(0xc9a227,.32,0x3a2c06));

      g.scale.y=0.01;
      this.anims.push({t:0,dur:820,fn:(k)=>{

  dust(x,z,n,col,high){

  addEnemy(e){
    const T=this.T;
    const g=this.makeFigure({robe:0xa82f26,robe2:0x6e1a14,skin:0xc4835c,
      hat:'helm2',prop:'spear2',hair:0x1c1815});
    const ar=new T.Group();
    const shaft=new T.Mesh(new T.BoxGeometry(0.09,0.09,0.4), this.mat(0xe2564a,.5,0x5a1a14));
    shaft.position.z=-0.22; ar.add(shaft);
    const at=new T.Mesh(new T.ConeGeometry(0.15,0.28,4), this.mat(0xe2564a,.5,0x5a1a14));
    at.position.z=-0.54; at.rotation.x=-Math.PI/2; ar.add(at);

    const p=this.pos(e.x,e.y); g.position.set(p.x,0,p.z);

  syncEnemies(st, tween){
    st.es.forEach((e,i)=>{
      const o=this.enemies[i]; if(!o) return;
      const to=this.pos(e.x,e.y);
      if(tween){
        const from={x:o.g.position.x,z:o.g.position.z};
        if(Math.abs(from.x-to.x)>0.01||Math.abs(from.z-to.z)>0.01){
          const far=Math.abs(from.x-to.x)+Math.abs(from.z-to.z)>1.6;
          const face=Math.atan2(to.x-from.x, to.z-from.z);
          const u=o.g.userData;
          this.anims.push({t:0,dur:far?680:440,fn:(k)=>{
            const ee=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
            o.g.position.x=from.x+(to.x-from.x)*ee;
            o.g.position.z=from.z+(to.z-from.z)*ee;
            u.baseY=far?Math.sin(k*Math.PI)*1.5:Math.abs(Math.sin(k*Math.PI*2))*0.07;
            o.g.rotation.y=face;
            // 走路擺手
            if(u.armR) u.armR.rotation.x=Math.sin(k*Math.PI*2)*0.5;
            if(u.armL) u.armL.rotation.x=-Math.sin(k*Math.PI*2)*0.5;
            if(far) o.g.rotation.x=k*6.283;         // 被拋飛時翻滾
            if(k>=1){ u.baseY=0; o.g.rotation.x=0;
              if(u.armR) u.armR.rotation.x=0; if(u.armL) u.armL.rotation.x=0; }
          }});
        }
      } else { o.g.position.set(to.x,0,to.z); }
      // 睡著
      if(e.sleep>0 && !o.zzz) this.sleepFx(i,true);
      if(e.sleep===0 && o.zzz) this.sleepFx(i,false);
      // 喝醉
      if(e.drunk>0 && !o.drunkFx) this.drunkFx(i,true);
      if(e.drunk===0 && o.drunkFx) this.drunkFx(i,false);
      o.arrow.visible = e.sleep===0;
    });
  },
  sleepFx(i,on){
    const T=this.T, o=this.enemies[i]; if(!o) return;
    if(on){
      const p={x:o.g.position.x,z:o.g.position.z};
      this.anims.push({t:0,dur:700,fn:(k)=>{
        const e=1-Math.pow(1-k,3);
        o.g.rotation.z=e*Math.PI*0.46;
        o.g.userData.baseY=-e*0.06;
        if(o.g.userData.armR) o.g.userData.armR.rotation.x=-e*0.8;
        if(k>=1) this.dust(p.x,p.z,16,0xb8b09c,0.12);
      }});
      const zg=new T.Group();
      for(let n=0;n<3;n++){
        const z=new T.Mesh(new T.BoxGeometry(0.14,0.035,0.02),
          new T.MeshBasicMaterial({color:0x6fd0b0,transparent:true,opacity:.9}));
        z.position.set(0.1*n,1.5+n*0.22,0); z.rotation.z=0.5; zg.add(z);
      }
      o.g.add(zg); o.zzz=zg;
    }else{
      this.anims.push({t:0,dur:420,fn:(k)=>{ const e=1-Math.pow(1-k,3);
        o.g.rotation.z=(1-e)*Math.PI*0.44; }});
      if(o.zzz){ o.g.remove(o.zzz); o.zzz=null; }
    }
  },
  drunkFx(i,on){
    const T=this.T, o=this.enemies[i]; if(!o) return;
    if(on){
      const g=new T.Group();
      for(let n=0;n<3;n++){
        const b=new T.Mesh(new T.SphereGeometry(0.07,8,6),
          new T.MeshBasicMaterial({color:0xd8a0e0,transparent:true,opacity:.7}));
        b.position.set(Math.cos(n*2.1)*0.22,1.45,Math.sin(n*2.1)*0.22); g.add(b);
      }
      o.g.add(g); o.drunkFx=g;
      this.anims.push({t:0,dur:99999,fn:()=>{ if(o.drunkFx) o.drunkFx.rotation.y+=0.05; }});
    }else if(o.drunkFx){ o.g.remove(o.drunkFx); o.drunkFx=null; }
  },
  setArrow(i,dx,dy,show){
    const o=this.enemies[i]; if(!o) return;
    o.arrow.visible=!!show; if(!show) return;
    o.arrow.rotation.y=Math.atan2(-dx,-dy);
  },

  showGhost(cells,center){
    const T=this.T; this.clearGhost();
    const g=new T.Group();

      const b=new T.Mesh(new T.BoxGeometry(0.9,1.7,0.9),mat); b.position.set(p.x,0.85,p.z); g.add(b); });
    const p=this.pos(center.x,center.y);
    // 城樓上一張案几與一把琴，加一個撫琴的人影
    const desk=new T.Mesh(new T.BoxGeometry(0.7,0.06,0.3), this.mat(0x6b4f2a,.8));
    desk.position.set(p.x,1.82,p.z); g.add(desk);
    const qin=new T.Mesh(new T.BoxGeometry(0.62,0.07,0.2), this.mat(0xc9a227,.35,0x4a3a08));
    qin.position.set(p.x,1.89,p.z); g.add(qin);
    for(let i=0;i<5;i++){ const st=new T.Mesh(new T.BoxGeometry(0.58,0.01,0.01),
      new T.MeshBasicMaterial({color:0xffe9a8,transparent:true,opacity:.9}));
      st.position.set(p.x,1.94,p.z-0.07+i*0.035); g.add(st);
      this.anims.push({t:0,dur:99999,fn:()=>{ st.scale.y=1+Math.sin(this._t*9+i)*0.9; }});
    }
    const sit=new T.Mesh(new T.CylinderGeometry(0.13,0.2,0.36,10),
      new T.MeshStandardMaterial({color:0xf0ead9,transparent:true,opacity:.8,roughness:.85}));
    sit.position.set(p.x,2.12,p.z-0.28); g.add(sit);
    const shead=new T.Mesh(new T.SphereGeometry(0.1,12,10),
      new T.MeshStandardMaterial({color:0xd9b48a,transparent:true,opacity:.8,roughness:.6}));
    shead.position.set(p.x,2.4,p.z-0.28); g.add(shead);
    // 兩面旗
    [-1,1].forEach(sd=>{
      const pole=new T.Mesh(new T.CylinderGeometry(0.02,0.02,2.2,6), this.mat(0x5a4a30,.85));
      pole.position.set(p.x+sd*0.44,1.1,p.z); g.add(pole);
      const fl=new T.Mesh(new T.PlaneGeometry(0.32,0.24,4,3),
        new T.MeshStandardMaterial({color:0x9b6bb5,transparent:true,opacity:.75,side:T.DoubleSide,roughness:.9}));
      fl.position.set(p.x+sd*0.6,1.95,p.z); g.add(fl);
      const pa=fl.geometry.attributes.position;
      this.anims.push({t:0,dur:99999,fn:()=>{
        for(let i=0;i<pa.count;i++) pa.setZ(i, Math.sin(pa.getX(i)*6+this._t*5)*0.06);
        pa.needsUpdate=true;
      }});
    });
    g.scale.y=0.01;
    this.anims.push({t:0,dur:640,fn:(k)=>{ g.scale.y=0.01+(1-Math.pow(1-k,3))*0.99; }});
    this.dust(p.x,p.z,24,0xb98fd0,0.4);
    this.flash(p.x,1.6,p.z,0xb98fd0,2.0);
    this.objGroup.add(g); this.ghostGroup=g; this.shake=Math.max(this.shake,0.18);
  },
  clearGhost(){ if(this.ghostGroup){ this.objGroup.remove(this.ghostGroup); this.ghostGroup=null; } },

  addMark(x,y){
    const T=this.T, p=this.pos(x,y), g=new T.Group();
    const base=new T.Mesh(new T.CylinderGeometry(0.3,0.34,0.08,12), this.mat(0xc9a227,.3,0x3a2c06));
    base.position.y=0.13; g.add(base);
    const seal=new T.Mesh(new T.BoxGeometry(0.26,0.34,0.06), this.mat(0xc9a227,.3,0x4a3808));
    seal.position.y=0.36; g.add(seal);
    g.position.set(p.x,2.4,p.z);
    this.anims.push({t:0,dur:520,fn:(k)=>{
      const e=k*k;                                  // 加速落下
      g.position.y=2.4*(1-e);
      g.rotation.y=k*Math.PI*3;
      if(k>=1){ g.position.y=0; this.dust(p.x,p.z,26,0xe8d59a,0.15);
        this.flash(p.x,0.6,p.z,0xffe08a,2.2); this.shake=Math.max(this.shake,0.28); }
    }});
    this.objGroup.add(g); this.marks[y*6+x]=g;
  },
  clearMarks(){ Object.values(this.marks).forEach(m=>this.objGroup.remove(m)); this.marks={}; },

  highlight(list){
    const T=this.T;
    this.hi.forEach(m=>this.tileGroup.remove(m)); this.hi=[];
    list.forEach(({x,y})=>{ const p=this.pos(x,y);
      const m=new T.Mesh(new T.BoxGeometry(0.94,0.02,0.94),
        new T.MeshBasicMaterial({color:0xc9a227,transparent:true,opacity:.5}));
      m.position.set(p.x,0.09,p.z); this.tileGroup.add(m); this.hi.push(m); });
  },

  pick(ev){
    if(!this.ok) return null;
    const r=this.ren.domElement.getBoundingClientRect();
    const v=new this.T.Vector2(((ev.clientX-r.left)/r.width)*2-1, -((ev.clientY-r.top)/r.height)*2+1);
    this.ray.setFromCamera(v,this.cam);
    const hit=this.ray.intersectObjects(this.tiles,false);
    return hit.length?hit[0].object.userData:null;
  },

  loop(now){
    if(!this.ok) return;
    requestAnimationFrame(t=>this.loop(t));
    const dt=this._last?Math.min(60,now-this._last):16; this._last=now;
    this.anims=this.anims.filter(a=>{ a.t+=dt; const k=Math.min(1,a.t/a.dur); a.fn(k); return k<1; });
    this.puffs=this.puffs.filter(p=>{
      p.m.position.x+=p.vx; p.m.position.y+=p.vy; p.m.position.z+=p.vz;
      p.vy-=0.0016; p.life-=0.022; p.m.material.opacity=Math.max(0,p.life*0.75);
      p.m.scale.multiplyScalar(1.012);
      if(p.life<=0){ this.fxGroup.remove(p.m); return false; } return true; });
    this.rings=this.rings.filter(r=>{
      r.r+=0.16; const k=r.r/r.max;
      if(r.cyl){ r.m.scale.set(r.r/0.3,1,r.r/0.3); r.m.material.opacity=Math.max(0,0.4*(1-k)); }
      else { r.m.scale.setScalar(r.r/0.31); r.m.material.opacity=Math.max(0,0.9*(1-k)); }
      if(k>=1){ this.fxGroup.remove(r.m); return false; } return true; });
    // 呼吸：所有人物微微起伏＋手臂晃動，靜止時也是活的
    this._t=(this._t||0)+dt*0.001;
    const breathe=(f,i)=>{
      if(!f||!f.userData) return;
      const u=f.userData, ph=u.phase||0;
      const b=Math.sin(this._t*1.6+ph);
      f.position.y=(u.baseY||0)+b*0.012;
      if(u.robe) u.robe.scale.set(1+b*0.008,1-b*0.006,1+b*0.008);
      if(u.head) u.head.rotation.z=Math.sin(this._t*0.9+ph)*0.03;
    };
    Object.values(this.heroes).forEach(breathe);
    this.enemies.forEach(o=>{ if(!o.zzz) breathe(o.g); });
    // 睡著的人胸口起伏更明顯
    this.enemies.forEach(o=>{ if(o.zzz&&o.g.userData.robe){
      const b=Math.sin(this._t*1.1);
      o.g.userData.robe.scale.set(1+b*0.03,1,1+b*0.03); } });
    if(this.flashLight) this.flashLight.intensity*=0.9;
    if(this.shake>0.002){
      this.cam.position.x=this.camHome.x+(Math.random()-.5)*this.shake;
      this.cam.position.z=this.camHome.z+(Math.random()-.5)*this.shake;
      this.cam.lookAt(0.2,0,0.5); this.shake*=0.87;
    }
    this.ren.render(this.scene,this.cam);
  },
  resize(){
    if(!this.ok) return;
    const host=document.getElementById('view');
    this.cam.aspect=host.clientWidth/host.clientHeight;
    this.cam.updateProjectionMatrix(); this.ren.setSize(host.clientWidth,host.clientHeight);
  }
};
window.addEventListener('resize',()=>V.resize());

/* ══════════ 音效 ══════════ */
const S=(()=>{let ac=null;
  const ok=()=>{try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();return 1}catch(e){return 0}};
  const t=(f,d,ty,v)=>{if(!ok())return;const o=ac.createOscillator(),g=ac.createGain();
    o.type=ty||'sine';o.frequency.value=f;g.gain.setValueAtTime(0,ac.currentTime);
    g.gain.linearRampToValueAtTime(v||.12,ac.currentTime+.008);
    g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);
    o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);};
  const noise=(d,v,f)=>{if(!ok())return;const n=ac.sampleRate*d,b=ac.createBuffer(1,n,ac.sampleRate),c=b.getChannelData(0);
    for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);
    const src=ac.createBufferSource();src.buffer=b;const fl=ac.createBiquadFilter();
    fl.type='bandpass';fl.frequency.value=f||500;const g=ac.createGain();g.gain.value=v;
    src.connect(fl);fl.connect(g);g.connect(ac.destination);src.start();};
  return{
    tap:()=>t(520,.06,'triangle',.08),
    imhotep:()=>{noise(.5,.2,260);[110,140,170,200].forEach((f,i)=>setTimeout(()=>t(f,.2,'square',.1),i*110))},
    huatuo:()=>{t(440,.16,'sine',.1);setTimeout(()=>t(260,.3,'sine',.09),110);setTimeout(()=>t(170,.4,'sine',.07),260)},
    zhugeliang:()=>{noise(.35,.12,900);[620,780,930].forEach((f,i)=>setTimeout(()=>t(f,.22,'triangle',.08),i*90))},
    zhangheng:()=>{noise(.7,.26,120);[70,90,110].forEach((f,i)=>setTimeout(()=>t(f,.4,'sawtooth',.14),i*90))},
    zhangfei:()=>{noise(.55,.3,700);[180,140,110].forEach((f,i)=>setTimeout(()=>t(f,.3,'square',.15),i*70))},
    zhenghe:()=>{noise(.6,.18,420);[300,400,520,660].forEach((f,i)=>setTimeout(()=>t(f,.26,'triangle',.1),i*95))},
    libai:()=>{[520,470,600,430].forEach((f,i)=>setTimeout(()=>t(f,.24,'sine',.1),i*130))},
    elizabeth1:()=>{[784,988].forEach((f,i)=>setTimeout(()=>t(f,.3,'triangle',.11),i*140));noise(.3,.1,1500)},
    step:()=>noise(.08,.09,340),
    win:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>t(f,.28,'triangle',.12),i*118))},
    lose:()=>{noise(.5,.2,180);[400,300,220,150].forEach((f,i)=>setTimeout(()=>t(f,.26,'square',.1),i*140))}
  };
})();

/* ══════════ 遊戲流程 ══════════ */
const G={
  lv:0, E:null, st:null, sel:null, left:[], busy:false, cleared:0,
  el(id){return document.getElementById(id)},
  go(n){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
    this.el('s-'+n).classList.add('on'); window.scrollTo(0,0);
    if(n==='play') setTimeout(()=>V.resize(),50);},

  menu(){
    const box=this.el('lvList'); box.innerHTML='';
    LEVELS.forEach((L,i)=>{
      const lock = i>this.cleared;
      const d=document.createElement('div');
      d.className='lv'+(lock?' lock':'');
      d.innerHTML='<b>第 '+L.id+' 關　'+L.name+'</b>'+
        '<span>'+L.turns+' 回合　'+L.enemies.length+' 個敵人　'+
        L.heroes.map(h=>HERO_DB[h].n).join('・')+'</span>';
      if(!lock) d.onclick=()=>this.start(i);
      box.appendChild(d);
    });
    this.go('menu');
  },

  async start(i){
    S.tap(); this.lv=i;
    this.go('play');
    const ok=await V.boot();
    if(!ok){ document.getElementById('view').innerHTML=
      '<div id="loading"><div class="err">3D 引擎載不起來，可能是網路被擋。</div></div>'; return; }
    V.resize();
    const L=LEVELS[i];
    this.E=makeEngine(L);
    this.st=this.E.fresh();
    this.left=L.heroes.slice();
    this.sel=null; this.busy=false;
    V.reset(L,this.st);
    if(!V._loop){ V._loop=1; requestAnimationFrame(t=>V.loop(t)); }
    this.el('lvName').textContent='第 '+L.id+' 關　'+L.name;
    this.el('tip').textContent=L.tip;
    this.say('選一位偉人，或直接跳過這回合');
    this.refresh();
  },
  say(t){ this.el('say').textContent=t; },

  refresh(){
    const L=LEVELS[this.lv], st=this.st;
    const box=this.el('heroes'); box.innerHTML='';
    L.heroes.forEach(id=>{
      const h=HERO_DB[id], used=!this.left.includes(id);
      const d=document.createElement('div');
      d.className='h'+(this.sel===id?' on':'')+(used?' used':'');
      d.innerHTML='<b>'+h.n+'</b><i>'+h.s+'</i><u>'+h.d+'</u>';
      if(!used) d.onclick=()=>{ if(this.busy)return; S.tap();
        this.sel=this.sel===id?null:id;
        if(this.sel && h.t==='none'){ this.use({id}); return; }
        this.say(this.sel?(h.t==='enemy'?'點一個敵人':'點地上的一格'):'選一位偉人');
        this.refresh(); };
      box.appendChild(d);
    });
    const tb=this.el('turnbar'); tb.innerHTML='';
    for(let i=0;i<L.turns;i++){ const e=document.createElement('i');
      if(i<st.turn)e.className='done'; else if(i===st.turn)e.className='now'; tb.appendChild(e); }
    this.el('turnTxt').textContent='第 '+(st.turn+1)+' / '+L.turns+' 回合';
    // 箭頭
    st.es.forEach((e,i)=>{
      if(e.sleep>0||e.stop>0){ V.setArrow(i,0,0,false); return; }
      const n=this.E.nextStep(st,e);
      if(n) V.setArrow(i,n.x-e.x,n.y-e.y,true); else V.setArrow(i,0,0,false);
    });
    // 可點的格子
    if(this.sel){
      const h=HERO_DB[this.sel], list=[];
      this.E.options(st,[this.sel]).forEach(o=>{
        if(!o) return;
        if(h.t==='enemy'){ const e=st.es[o.i]; list.push({x:e.x,y:e.y}); }
        else if(o.x!==undefined) list.push({x:o.x,y:o.y});
      });
      V.highlight(list);
    } else V.highlight([]);
  },

  tapCell(x,y){
    if(this.busy||!this.sel) return;
    const h=HERO_DB[this.sel];
    if(h.t==='enemy'){
      const i=this.st.es.findIndex(e=>e.x===x&&e.y===y&&e.sleep===0);
      if(i<0){ this.say('要點在敵人身上'); return; }
      this.use({id:this.sel,i}); return;
    }
    const legal=this.E.options(this.st,[this.sel]).some(o=>o&&o.x===x&&o.y===y);
    if(!legal){ this.say('那一格不行'); return; }
    this.use({id:this.sel,x,y});
  },

  use(a){
    const h=HERO_DB[a.id], st=this.st;
    this.busy=true; this.left=this.left.filter(z=>z!==a.id); this.sel=null;
    V.highlight([]);
    this.say(h.n+' 使出　'+h.s);
    const before=st.es.map(e=>({x:e.x,y:e.y}));
    V.heroAct(a.id, ()=>{
      this.E.act(st,a);
      S[a.id] && S[a.id]();
      if(a.id==='huatuo'){ V.throwGourd(a.i); }
      // 各招的專屬演出
      if(a.id==='imhotep') V.addWall(a.x,a.y,true);
      if(a.id==='zhugeliang') V.showGhost([...this.E.fearSet(st)],{x:a.x,y:a.y});
      if(a.id==='elizabeth1') V.addMark(a.x,a.y);
      if(a.id==='zhangheng'){ const p=V.pos(this.E.city.x,this.E.city.y);
        V.ring(p.x,p.z,0x8fd0b0,6.2,1); V.shake=0.55;
        // 全場地板抖動
        V.tiles.forEach((t,i)=>{ const d0=t.position.y;
          V.anims.push({t:0,dur:600,fn:(k)=>{
            t.position.y=d0+Math.sin(k*Math.PI*3+i)*0.09*(1-k); }}); });
        before.forEach((b,i)=>{ const pp=V.pos(b.x,b.y); V.dust(pp.x,pp.z,12,0xc8c0aa,0.2); });
      }
      if(a.id==='zhangfei'){ const p=V.pos(a.x,a.y);
        V.ring(p.x,p.z,0xe2564a,3.4,1); V.dust(p.x,p.z,40,0xe0b0a0,0.3); V.shake=0.5;
        V.flash(p.x,1.0,p.z,0xff8060,2.6); }
      if(a.id==='zhenghe'){ const b=before[a.i], p=V.pos(b.x,b.y);
        V.dust(p.x,p.z,32,0xa8c8e8,0.5); V.ring(p.x,p.z,0x8fb8e0,2.6);
        const e2=st.es[a.i], p2=V.pos(e2.x,e2.y);
        setTimeout(()=>{ V.dust(p2.x,p2.z,24,0xa8c8e8,0.4); V.shake=0.3; },520); }
      if(a.id==='libai'){ const e=st.es[a.i], p=V.pos(e.x,e.y);
        V.dust(p.x,p.z,26,0xd8a0e0,0.7); V.flash(p.x,1.0,p.z,0xd8a0e0,1.6);
        // 被灌醉的人原地打轉
        const o=V.enemies[a.i];
        if(o) V.anims.push({t:0,dur:700,fn:(k)=>{ o.g.rotation.y=k*6.283*1.5; }});
      }
      const delay = a.id==='huatuo' ? 560 : 0;
      setTimeout(()=>V.syncEnemies(st,true), delay);
      setTimeout(()=>this.enemyTurn(), 900+delay);
    });
  },
  pass(){ if(this.busy)return; S.tap(); this.sel=null; this.busy=true;
    V.highlight([]); this.say('按兵不動');
    setTimeout(()=>this.enemyTurn(),350); },

  enemyTurn(){
    const st=this.st;
    const alive=this.E.enemyPhase(st);
    if(st.fearLeft===0) V.clearGhost();
    if(!st.decree) V.clearMarks();
    V.syncEnemies(st,true);
    S.step();
    setTimeout(()=>{
      this.busy=false;
      if(!alive){ this.end(false); return; }
      st.turn++;
      if(st.turn>=LEVELS[this.lv].turns){ this.end(true); return; }
      this.say('選一位偉人，或直接跳過這回合');
      this.refresh();
    }, 700);
  },

  end(win){
    S[win?'win':'lose'](); V.shake=win?0.12:0.45;
    const L=LEVELS[this.lv];
    if(win && this.lv+1>this.cleared) this.cleared=this.lv+1;
    this.el('endTxt').textContent=win?'守 住 了':'城 破 了';
    this.el('endTxt').style.color=win?'var(--gold)':'var(--cinnabar)';
    this.el('endSub').textContent=win
      ? ('第 '+L.id+' 關「'+L.name+'」過了。')
      : ('敵人衝進城了。'+L.tip);
    const box=this.el('facts'); box.innerHTML='';
    if(win) L.heroes.forEach(id=>{ const h=HERO_DB[id];
      const d=document.createElement('div'); d.className='fact';
      d.innerHTML='<b>'+h.n+'・'+h.s+'</b>'+h.f; box.appendChild(d); });
    const nx=this.el('nextBtn');
    if(win && this.lv+1<LEVELS.length){ nx.style.display='block'; nx.onclick=()=>this.start(this.lv+1); }
    else nx.style.display='none';
    this.el('retryBtn').onclick=()=>this.start(this.lv);
    setTimeout(()=>this.go('end'),650);
  }
};
document.getElementById('view').addEventListener('click',ev=>{
  const c=V.pick(ev); if(c) G.tapCell(c.x,c.y);
});
document.addEventListener('gesturestart',e=>e.preventDefault());

// 偉人清單
(function(){
  const box=document.getElementById('whoList');
  Object.keys(HERO_DB).forEach(id=>{
    const h=HERO_DB[id];
    const d=document.createElement('div'); d.className='fact';
    d.innerHTML='<b>'+h.n+'　'+h.j+'　'+h.s+'</b>'+h.d+'<br><span style="color:var(--dim)">'+h.f+'</span>';
    box.appendChild(d);
  });
})();
