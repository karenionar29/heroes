<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#12151c">
<title>手感原型　三選一</title>
<style>
:root{--ink:#12151c;--slate:#1d222d;--line:#2c3342;--paper:#e8e0cf;
  --cinnabar:#b5342b;--jade:#2f8f74;--gold:#c9a227;--dim:#8b93a4;
  --serif:"Noto Serif TC","Songti TC",serif;
  --sans:-apple-system,"PingFang TC","Noto Sans TC",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--sans);
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:520px;margin:0 auto;padding:12px}
.screen{display:none}.screen.on{display:block}
h1{font-family:var(--serif);font-size:30px;letter-spacing:.16em;text-align:center;margin:24px 0 4px}
.sub{text-align:center;color:var(--dim);font-size:12px;letter-spacing:.14em;margin-bottom:18px}
.btn{display:block;width:100%;padding:15px;margin:9px 0;border:1px solid var(--line);
  background:var(--slate);color:var(--paper);font-family:var(--serif);font-size:17px;
  letter-spacing:.1em;border-radius:3px;cursor:pointer;text-align:left}
.btn.main{background:var(--cinnabar);border-color:#8f2820}
.btn small{display:block;font-family:var(--sans);font-size:12px;color:var(--dim);
  letter-spacing:0;margin-top:4px;line-height:1.6}
.btn.main small{color:rgba(255,255,255,.75)}
.topbar{display:flex;justify-content:space-between;align-items:center;
  font-size:12px;color:var(--dim);letter-spacing:.1em;margin-bottom:8px}
.topbar button{background:none;border:1px solid var(--line);color:var(--dim);
  font-size:12px;padding:5px 10px;border-radius:3px;cursor:pointer}
canvas{display:block;width:100%;border-radius:4px;background:#0d1016;border:1px solid var(--line);touch-action:none}
.hint{color:var(--dim);font-size:12.5px;line-height:1.8;margin:10px 0}
.big{font-family:var(--serif);font-size:24px;letter-spacing:.1em;text-align:center;margin:12px 0}
.row{display:flex;gap:8px;margin-top:8px}
.row .btn{margin:0}
.hpbar{height:9px;background:#0b0e13;border:1px solid var(--line);border-radius:2px;overflow:hidden;margin:8px 0 2px}
.hpbar i{display:block;height:100%;background:var(--cinnabar);transition:width .2s}
.stat{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.tools{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.sw.on{border-color:var(--gold)}
</style>
</head>
<body>
<div class="wrap">

<section id="menu" class="screen on">
  <h1>手感原型</h1>
  <div class="sub">三 個 方 向 　 各 三 十 秒</div>
  <p class="hint">不是遊戲，是三段手感測試。玩完只要回答一句：<b style="color:var(--gold)">哪一個讓你想再按一次？</b></p>
  <button class="btn main" onclick="go('a')">A　水墨程序美術
    <small>一樣是打牌，但改成 Canvas 畫出來的水墨人物、噴墨、震動。測「同樣的內容，變好看有沒有用」。</small></button>
  <button class="btn main" onclick="go('b')">B　畫畫被評分
    <small>十五秒畫一個東西，系統當場判你像不像。測「手一直在動好不好玩」。</small></button>
  <button class="btn main" onclick="go('c')">C　即時動作
    <small>敵人衝過來，抓時機揮筆。測「操作手感撐不撐得住」。</small></button>
  <p class="hint" style="margin-top:18px">三個都是真的能玩，不是動畫示範。</p>
</section>

<!-- ═════════ A 水墨 ═════════ -->
<section id="a" class="screen">
  <div class="topbar"><span>A　水墨程序美術</span><button onclick="go('menu')">返回</button></div>
  <canvas id="ca" width="500" height="420"></canvas>
  <div class="hpbar"><i id="aHp" style="width:100%"></i></div>
  <div class="stat" id="aStat">點畫面攻擊</div>
  <div class="row">
    <button class="btn" onclick="A.attack('slash')">丈八蛇矛　斬</button>
    <button class="btn" onclick="A.attack('brain')">借東風　術</button>
  </div>
  <p class="hint">跟《登樓》完全一樣的數值，只是把數字換成畫面。</p>
</section>

<!-- ═════════ B 畫畫 ═════════ -->
<section id="b" class="screen">
  <div class="topbar"><span id="bTitle">B　畫畫被評分</span><button onclick="go('menu')">返回</button></div>
  <div class="big" id="bPrompt">準備</div>
  <canvas id="cb" width="500" height="420"></canvas>
  <div class="tools" id="bTools"></div>
  <div class="row">
    <button class="btn" onclick="B.undo()">復原</button>
    <button class="btn main" onclick="B.done()">畫好了</button>
  </div>
  <p class="hint" id="bHint">按「開始」出題，十五秒內畫完。</p>
  <button class="btn" onclick="B.start()">開始 / 再來一題</button>
</section>

<!-- ═════════ C 動作 ═════════ -->
<section id="c" class="screen">
  <div class="topbar"><span>C　即時動作</span><button onclick="go('menu')">返回</button></div>
  <canvas id="cc" width="500" height="420"></canvas>
  <div class="stat" id="cStat">點畫面開始</div>
  <p class="hint">墨團衝到紅線時點畫面。太早太晚都會漏，連續打中會加倍。</p>
</section>

</div>
<script>
/* ============ 共用：水墨筆觸繪製工具 ============ */
const IK = {
  // 一筆有粗細變化的墨線（起筆重、收筆輕）
  stroke(g, pts, w, alpha, col) {
    g.save(); g.strokeStyle = col || '#e8e0cf'; g.lineCap = 'round'; g.lineJoin = 'round';
    for (let i = 1; i < pts.length; i++) {
      const t = i / pts.length;
      g.globalAlpha = (alpha || 1) * (0.45 + 0.55 * (1 - t));
      g.lineWidth = w * (1 - t * 0.75) + 1;
      g.beginPath(); g.moveTo(pts[i-1][0], pts[i-1][1]); g.lineTo(pts[i][0], pts[i][1]); g.stroke();
    }
    g.restore();
  },
  // 飛白：沿著線隨機掉一些小點，看起來像乾筆
  splatter(g, x, y, n, r, col) {
    g.save(); g.fillStyle = col || '#e8e0cf';
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, d = Math.random() * r;
      g.globalAlpha = 0.15 + Math.random() * 0.5;
      g.beginPath(); g.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, Math.random() * 3 + 0.6, 0, 7); g.fill();
    }
    g.restore();
  },
  // 一個用筆畫出來的人形（種子決定長相，換種子=換人）
  figure(g, cx, cy, s, seed, col, lean) {
    let r = seed;
    const rn = () => (r = (r * 9301 + 49297) % 233280) / 233280;
    const L = lean || 0;
    // 身體
    IK.stroke(g, [[cx, cy - 40*s], [cx + L*8, cy], [cx - L*4, cy + 38*s]], 13*s, 1, col);
    // 頭
    g.save(); g.strokeStyle = col; g.globalAlpha = .9; g.lineWidth = 4.5*s;
    g.beginPath(); g.ellipse(cx + L*3, cy - 54*s, 15*s, 17*s, L*.1, 0, 7); g.stroke(); g.restore();
    // 兩隻手臂
    IK.stroke(g, [[cx, cy - 26*s], [cx + (26 + rn()*16)*s, cy - (6 + rn()*22)*s]], 8*s, .95, col);
    IK.stroke(g, [[cx, cy - 22*s], [cx - (24 + rn()*14)*s, cy + (2 + rn()*18)*s]], 8*s, .95, col);
    // 兩條腿
    IK.stroke(g, [[cx, cy + 30*s], [cx + (16 + rn()*12)*s, cy + 76*s]], 9*s, .95, col);
    IK.stroke(g, [[cx, cy + 30*s], [cx - (14 + rn()*12)*s, cy + 76*s]], 9*s, .95, col);
    // 衣袍下襬的飛白
    IK.splatter(g, cx, cy + 40*s, 14, 26*s, col);
  }
};
function go(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  if(id==='c') C.reset(); if(id==='a') A.reset(); window.scrollTo(0,0); }

/* ============ 音效 ============ */
const S=(()=>{let ac=null;const ok=()=>{try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();
  if(ac.state==='suspended')ac.resume();return 1}catch(e){return 0}};
  const t=(f,d,ty,v)=>{if(!ok())return;const o=ac.createOscillator(),g=ac.createGain();
    o.type=ty||'sine';o.frequency.value=f;g.gain.setValueAtTime(0,ac.currentTime);
    g.gain.linearRampToValueAtTime(v||.14,ac.currentTime+.008);
    g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);
    o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);};
  // 噪音當作「刷」的筆觸聲
  const noise=(d,v)=>{if(!ok())return;const n=ac.sampleRate*d,b=ac.createBuffer(1,n,ac.sampleRate),c=b.getChannelData(0);
    for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);
    const src=ac.createBufferSource();src.buffer=b;const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=1800;
    const g=ac.createGain();g.gain.value=v||.16;src.connect(f);f.connect(g);g.connect(ac.destination);src.start();};
  return{slash:()=>{noise(.16,.2);t(190,.1,'square',.1)},
    boom:()=>{noise(.3,.24);t(80,.28,'sawtooth',.16)},
    tick:()=>t(880,.05,'triangle',.07),
    good:()=>{[660,880,1100].forEach((f,i)=>setTimeout(()=>t(f,.16,'triangle',.11),i*70))},
    bad:()=>t(150,.22,'square',.1),
    miss:()=>t(110,.16,'sine',.08)};
})();

/* ═══════════ A：水墨程序美術 ═══════════ */
const A = (() => {
  const cv = document.getElementById('ca'), g = cv.getContext('2d');
  let hp = 100, shake = 0, fx = [], hitT = 0, seed = 777, dead = false;
  function reset(){ hp=100; fx=[]; shake=0; dead=false; seed=(Math.random()*9999|0)+1;
    document.getElementById('aStat').textContent='點畫面攻擊'; loop(); }
  function attack(kind){
    if(dead) { reset(); return; }
    const dmg = kind==='slash' ? 22 : 23;
    hp = Math.max(0, hp - dmg); shake = kind==='slash'?16:11; hitT = 1;
    kind==='slash' ? S.slash() : S.boom();
    // 噴墨粒子
    for(let i=0;i<38;i++) fx.push({x:250,y:200,
      vx:(Math.random()-.5)*(kind==='slash'?22:14), vy:(Math.random()-.5)*20-3,
      r:Math.random()*5+1.5, a:1, g:.55});
    // 斬擊軌跡
    if(kind==='slash') fx.push({slash:1,t:0,a1:Math.random()*.8-.4});
    else fx.push({ring:1,t:0});
    document.getElementById('aHp').style.width=hp+'%';
    document.getElementById('aStat').textContent = hp>0 ? ('造成 '+dmg+' 傷害　剩 '+hp) : '倒下了　再點一次重來';
    if(hp<=0){ dead=true; for(let i=0;i<70;i++) fx.push({x:250,y:210,
      vx:(Math.random()-.5)*26,vy:(Math.random()-.5)*24-4,r:Math.random()*7+2,a:1,g:.4}); }
  }
  function loop(){
    const sx=(Math.random()-.5)*shake, sy=(Math.random()-.5)*shake;
    shake*=.86; if(shake<.4)shake=0;
    g.clearRect(0,0,500,420);
    g.save(); g.translate(sx,sy);
    // 背景一抹淡墨山
    g.globalAlpha=.13; g.fillStyle='#e8e0cf';
    g.beginPath(); g.moveTo(0,330); g.quadraticCurveTo(140,200,270,320);
    g.quadraticCurveTo(380,240,500,330); g.lineTo(500,420); g.lineTo(0,420); g.fill();
    g.globalAlpha=1;
    if(!dead){
      const lean = hitT>0 ? hitT*2.2 : 0;
      IK.figure(g,250,200,1.55,seed,'#e8e0cf',lean);
      if(hitT>0){ g.save(); g.globalAlpha=hitT*.5; g.fillStyle='#b5342b';
        g.beginPath(); g.arc(250,190,110,0,7); g.fill(); g.restore(); }
    }
    hitT*=.82; if(hitT<.02)hitT=0;
    fx=fx.filter(p=>{
      if(p.slash!==undefined){ p.t+=.09; if(p.t>1)return false;
        g.save(); g.translate(250,200); g.rotate(p.a1);
        g.strokeStyle='#e8e0cf'; g.globalAlpha=(1-p.t)*.95; g.lineCap='round';
        g.lineWidth=15*(1-p.t)+2;
        g.beginPath(); g.moveTo(-190+p.t*70,-60); g.quadraticCurveTo(0,10,190+p.t*70,60); g.stroke();
        g.restore(); return true; }
      if(p.ring!==undefined){ p.t+=.055; if(p.t>1)return false;
        g.save(); g.strokeStyle='#c9a227'; g.globalAlpha=(1-p.t)*.8; g.lineWidth=6*(1-p.t)+1;
        g.beginPath(); g.arc(250,195,30+p.t*160,0,7); g.stroke(); g.restore(); return true; }
      p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.a-=.022; p.r*=.985;
      if(p.a<=0)return false;
      g.globalAlpha=p.a; g.fillStyle='#e8e0cf';
      g.beginPath(); g.arc(p.x,p.y,p.r,0,7); g.fill(); return true;
    });
    g.restore(); g.globalAlpha=1;
    requestAnimationFrame(loop);
  }
  cv.addEventListener('pointerdown',()=>attack('slash'));
  return { reset, attack };
})();

/* ═══════════ B：畫畫被評分 ═══════════ */
const B = (() => {
  const cv=document.getElementById('cb'), g=cv.getContext('2d');
  const R=document.createElement('canvas'); R.width=500;R.height=420;
  const rg=R.getContext('2d');
  let strokes=[], cur=null, drawing=false, t0=0, timer=null, live=false, col='#e8e0cf', w=8;
  // 題目：用程式畫出來的參考圖形（不是圖檔）
  const TASKS=[
    {n:'鼎（三隻腳的大鍋）',draw(c){c.beginPath();c.moveTo(160,150);c.lineTo(340,150);c.lineTo(320,250);c.lineTo(180,250);c.closePath();c.fill();
      c.fillRect(190,250,22,90);c.fillRect(288,250,22,90);c.fillRect(239,250,22,90);
      c.fillRect(168,120,20,40);c.fillRect(312,120,20,40);}},
    {n:'船（有帆的）',draw(c){c.beginPath();c.moveTo(120,270);c.lineTo(380,270);c.lineTo(340,330);c.lineTo(160,330);c.closePath();c.fill();
      c.fillRect(245,110,12,160);c.beginPath();c.moveTo(251,120);c.lineTo(360,200);c.lineTo(251,255);c.closePath();c.fill();}},
    {n:'傘',draw(c){c.beginPath();c.arc(250,210,120,Math.PI,0);c.fill();c.fillRect(244,205,12,150);
      c.beginPath();c.arc(230,355,20,0,Math.PI);c.fill();}},
    {n:'金字塔',draw(c){c.beginPath();c.moveTo(250,90);c.lineTo(400,320);c.lineTo(100,320);c.closePath();c.fill();}},
    {n:'風箏（帶尾巴）',draw(c){c.beginPath();c.moveTo(250,90);c.lineTo(340,190);c.lineTo(250,300);c.lineTo(160,190);c.closePath();c.fill();
      c.lineWidth=9;c.strokeStyle=c.fillStyle;c.beginPath();c.moveTo(250,300);
      c.quadraticCurveTo(300,340,250,380);c.stroke();}}
  ];
  let task=null;
  ['#e8e0cf','#b5342b','#c9a227','#2f8f74','#5b7fb5'].forEach((c,i)=>{
    const d=document.createElement('div'); d.className='sw'+(i===0?' on':'');
    d.style.background=c; d.onclick=()=>{col=c;
      [...document.getElementById('bTools').children].forEach(x=>x.classList.remove('on'));
      d.classList.add('on');};
    document.getElementById('bTools').appendChild(d);
  });
  [4,9,18].forEach((n,i)=>{ const b=document.createElement('div');
    b.className='sw'+(i===1?' on':''); b.style.background='#1d222d';
    b.style.display='flex';b.style.alignItems='center';b.style.justifyContent='center';
    b.innerHTML='<div style="width:'+(n*0.9)+'px;height:'+(n*0.9)+'px;border-radius:50%;background:#e8e0cf"></div>';
    b.onclick=()=>{w=n;[...document.getElementById('bTools').children].slice(5).forEach(x=>x.classList.remove('on'));b.classList.add('on');};
    document.getElementById('bTools').appendChild(b); });
  function redraw(){ g.clearRect(0,0,500,420);
    if(task&&live){ g.save(); g.globalAlpha=.09; g.fillStyle='#e8e0cf'; g.strokeStyle='#e8e0cf'; task.draw(g); g.restore(); }
    strokes.forEach(s=>{ g.strokeStyle=s.c; g.lineWidth=s.w; g.lineCap='round'; g.lineJoin='round';
      g.beginPath(); s.p.forEach((pt,i)=>i?g.lineTo(pt[0],pt[1]):g.moveTo(pt[0],pt[1])); g.stroke(); });
  }
  function pos(e){ const r=cv.getBoundingClientRect();
    return [(e.clientX-r.left)/r.width*500,(e.clientY-r.top)/r.height*420]; }
  cv.addEventListener('pointerdown',e=>{ if(!live)return; drawing=true;
    cur={c:col,w:w,p:[pos(e)]}; strokes.push(cur); redraw(); });
  cv.addEventListener('pointermove',e=>{ if(!drawing)return; cur.p.push(pos(e)); redraw(); });
  window.addEventListener('pointerup',()=>{drawing=false;});
  function start(){
    task=TASKS[Math.random()*TASKS.length|0]; strokes=[]; live=true;
    document.getElementById('bPrompt').textContent='畫：'+task.n;
    document.getElementById('bHint').textContent='淡淡的參考影子在後面，照著畫也行。';
    t0=Date.now(); clearInterval(timer);
    timer=setInterval(()=>{ const left=15-((Date.now()-t0)/1000|0);
      document.getElementById('bTitle').textContent='剩 '+Math.max(0,left)+' 秒';
      if(left<=3&&left>0) S.tick();
      if(left<=0){ done(); } },300);
    redraw();
  }
  function undo(){ strokes.pop(); redraw(); }
  function done(){
    if(!live)return; live=false; clearInterval(timer);
    // 真的做判定：把參考圖和玩家的畫各自畫進離屏 canvas，算重疊率
    rg.clearRect(0,0,500,420); rg.fillStyle='#fff'; rg.strokeStyle='#fff'; task.draw(rg);
    const ref=rg.getImageData(0,0,500,420).data;
    rg.clearRect(0,0,500,420);
    strokes.forEach(s=>{ rg.strokeStyle='#fff'; rg.lineWidth=s.w+6; rg.lineCap='round'; rg.lineJoin='round';
      rg.beginPath(); s.p.forEach((pt,i)=>i?rg.lineTo(pt[0],pt[1]):rg.moveTo(pt[0],pt[1])); rg.stroke(); });
    const me=rg.getImageData(0,0,500,420).data;
    let inter=0, uni=0, mine=0;
    for(let i=3;i<ref.length;i+=4*4){ const a=ref[i]>40, b=me[i]>40;
      if(a&&b)inter++; if(a||b)uni++; if(b)mine++; }
    const iou = uni? inter/uni*100 : 0;
    const cover = ref.length? inter/Math.max(1,uni-mine+inter)*100 : 0;
    let verdict;
    if(iou>42) verdict='像！這個一看就知道是什麼';
    else if(iou>26) verdict='有那個意思了';
    else if(iou>13) verdict='勉強看得出來⋯⋯吧？';
    else verdict='這是什麼';
    iou>26?S.good():S.bad();
    document.getElementById('bPrompt').textContent=verdict;
    document.getElementById('bHint').innerHTML='題目：'+task.n+'　重疊率 <b style="color:var(--gold)">'
      +iou.toFixed(0)+'%</b>　（完整版這一步會換成 AI 猜你畫什麼，不是比對影子）';
    document.getElementById('bTitle').textContent='B　畫畫被評分';
    redraw();
  }
  return { start, undo, done };
})();

/* ═══════════ C：即時動作 ═══════════ */
const C = (() => {
  const cv=document.getElementById('cc'), g=cv.getContext('2d');
  let blobs=[], t=0, score=0, combo=0, running=false, flash=0, slashT=0, best=0, missT=0;
  const LINE=140;
  function reset(){ blobs=[]; t=0; score=0; combo=0; running=false; flash=0; slashT=0;
    document.getElementById('cStat').textContent='點畫面開始'; draw(); }
  function begin(){ running=true; blobs=[]; t=0; score=0; combo=0; loop(); }
  function hit(){
    if(!running){ begin(); return; }
    slashT=1; S.slash();
    // 找最靠近紅線的墨團
    let bi=-1, bd=1e9;
    blobs.forEach((b,i)=>{ const d=Math.abs(b.x-LINE); if(d<bd){bd=d;bi=i;} });
    if(bi>=0 && bd<52){
      const perfect = bd<18;
      combo++; score += (perfect?100:50)*Math.min(5,1+combo*0.25)|0;
      blobs[bi].dead=1; blobs[bi].pf=perfect;
      flash=perfect?1:.5; perfect?S.good():S.tick();
    } else { combo=0; S.miss(); missT=1; }
    best=Math.max(best,score);
  }
  function loop(){
    if(!running)return;
    t++;
    // 難度隨時間上升
    const rate = Math.max(26, 70 - t*0.09);
    if(t%(rate|0)===0) blobs.push({x:520,y:210+(Math.random()-.5)*90,r:22+Math.random()*14,
      v:2.6+Math.random()*1.6+t*0.0016,seed:Math.random()*999|0});
    blobs.forEach(b=>{ if(b.dead){ b.r*=.86; b.a=(b.a===undefined?1:b.a)-.09; } else b.x-=b.v; });
    blobs=blobs.filter(b=>{ if(b.dead) return b.a>0;
      if(b.x<-40){ combo=0; missT=1; S.miss(); return false; } return true; });
    draw();
    document.getElementById('cStat').textContent='分數 '+score+'　連擊 '+combo+'　最佳 '+best;
    requestAnimationFrame(loop);
  }
  function draw(){
    g.clearRect(0,0,500,420);
    // 判定線
    g.save(); g.globalAlpha=.85; g.strokeStyle='#b5342b'; g.lineWidth=3;
    g.beginPath(); g.moveTo(LINE,20); g.lineTo(LINE,400); g.stroke();
    g.globalAlpha=.13; g.fillStyle='#b5342b'; g.fillRect(LINE-52,20,104,380); g.restore();
    // 墨團（用程式畫的不規則墨滴）
    blobs.forEach(b=>{
      g.save(); g.globalAlpha=b.a===undefined?1:b.a;
      g.fillStyle=b.dead?(b.pf?'#c9a227':'#e8e0cf'):'#e8e0cf';
      g.beginPath();
      let r=b.seed;
      const rn=()=>(r=(r*9301+49297)%233280)/233280;
      for(let i=0;i<=14;i++){ const a=i/14*Math.PI*2, rr=b.r*(0.76+rn()*0.42);
        const x=b.x+Math.cos(a)*rr, y=b.y+Math.sin(a)*rr;
        i?g.lineTo(x,y):g.moveTo(x,y); }
      g.closePath(); g.fill();
      if(!b.dead) IK.splatter(g,b.x,b.y,5,b.r*1.5,'#e8e0cf');
      g.restore();
    });
    // 揮筆軌跡
    if(slashT>0){ g.save(); g.globalAlpha=slashT; g.strokeStyle='#e8e0cf'; g.lineCap='round';
      g.lineWidth=18*slashT+2; g.beginPath(); g.moveTo(LINE-70,410); g.quadraticCurveTo(LINE+30,210,LINE-40,10);
      g.stroke(); g.restore(); slashT-=.14; }
    if(flash>0){ g.save(); g.globalAlpha=flash*.32; g.fillStyle='#c9a227'; g.fillRect(0,0,500,420); g.restore(); flash-=.1; }
    if(missT>0){ g.save(); g.globalAlpha=missT*.28; g.fillStyle='#b5342b'; g.fillRect(0,0,500,420); g.restore(); missT-=.09; }
    if(!running){ g.save(); g.fillStyle='#e8e0cf'; g.globalAlpha=.85;
      g.font='600 22px "Noto Serif TC",serif'; g.textAlign='center';
      g.fillText('點畫面開始', 250, 215); g.restore(); }
  }
  cv.addEventListener('pointerdown',hit);
  return { reset };
})();

document.addEventListener('gesturestart',e=>e.preventDefault());
</script>
